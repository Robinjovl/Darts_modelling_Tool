workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE =~ /(\[skip ci\]|\[ci skip\]|\[skip pipeline\]|\[skip-cicd\]|\[skip cicd\]|\[skip-cd\]|\[skip cd\])/i'
      when: never
    # Draft MR pipeline -> MR_NON_DRAFT stays "0" (fast checks only).
    # CI_MERGE_REQUEST_DRAFT is the authoritative flag; the title regex is a fallback for the cases when variable is not defined.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_DRAFT == "true" || $CI_MERGE_REQUEST_TITLE =~ /^\s*(\[draft\]|\(draft\)|draft:)/i)'
      variables:
        MR_NON_DRAFT: "0"
      when: always
    # Ready (non-draft) MR pipeline -> the "final check": valgrind + full model set.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        MR_NON_DRAFT: "1"
      when: always
    # Branch push while an MR is open for that branch -> the MR pipeline above covers it; skip the duplicate branch pipeline.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - when: always

# ---------------------------------------------------------------------------
# Pipeline-level switches
# ---------------------------------------------------------------------------
variables:
  # Proprietary BOS-solvers CI twins: build-linux-BOS / test-linux-BOS and
  # build-windows-BOS / test-windows-BOS (ENABLE_BOS_SOLVERS=ON, `-a` build flag).
  #
  #   "1" (default) -> the BOS twins run exactly as before
  #   anything else -> all four BOS twins are skipped pipeline-wide
  RUN_BOS_JOBS: "1"
  # Set by workflow:rules above: "1" only for merge-request pipelines whose MR is NOT a draft.
  # Enables the longer valgrind job in MR pipelines and the larger model set in models/run_test_suite2.py
  # Marking an MR ready does not start a pipeline by itself - push a commit or trigger it manually.
  MR_NON_DRAFT: "0"

stages:
    - pre_commit
    - build_images
    - build
    - test
    - deploy
    - ingest

include:
  - local: '.cicd/jobs/build-linux-gpu.yml'
  - local: '.cicd/jobs/pre-commit.yml'
    rules:
      - if: $MCP_TRIGGER_TAHITI_GPU != "1"
  - local: '.cicd/jobs/cleanup-windows.yml'
    rules:
      - if: $MCP_TRIGGER_TAHITI_GPU != "1"
  - local: '.cicd/jobs/build-images.yml'
  - local: '.cicd/jobs/build-linux.yml'
    rules:
      - if: $MCP_TRIGGER_TAHITI_GPU != "1"
  - local: '.cicd/jobs/build-windows.yml'
    rules:
      - if: $MCP_TRIGGER_TAHITI_GPU != "1"
  - local: '.cicd/jobs/build-linux-valgrind.yml'
    rules:
      - if: $MCP_TRIGGER_TAHITI_GPU != "1"
  - local: '.cicd/jobs/test-linux.yml'
    rules:
      - if: $MCP_TRIGGER_TAHITI_GPU != "1"
  - local: '.cicd/jobs/test-windows.yml'
    rules:
      - if: $MCP_TRIGGER_TAHITI_GPU != "1"
  - local: '.cicd/jobs/test-linux-gpu.yml'
    rules:
      - if: $MCP_TRIGGER_TAHITI_GPU != "1"
  - local: '.cicd/jobs/valgrind-check.yml'
    rules:
      - if: $MCP_TRIGGER_TAHITI_GPU != "1"
  # - local: '.cicd/jobs/vtune-profile.yml'
    # rules:
    # - if: $MCP_TRIGGER_TAHITI_GPU != "1"
  - local: '.cicd/jobs/upload-wheels.yml'
    rules:
      - if: $MCP_TRIGGER_TAHITI_GPU != "1"
  - local: '.cicd/jobs/deploy.yml'
    rules:
      - if: $MCP_TRIGGER_TAHITI_GPU != "1"
  # - local: '.cicd/jobs/darts-models.yml'
  #   rules:
  #     - if: $MCP_TRIGGER_TAHITI_GPU != "1"
  - local: '.cicd/jobs/gitingest.yml'
    rules:
      - if: $MCP_TRIGGER_TAHITI_GPU != "1"
