docker-image-builder:
  stage: build_images
  tags:
    - linux
  image: 
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  needs:
    - job: lint-python
  script:
    - /kaniko/executor 
      --context "${CI_PROJECT_DIR}/.cicd/build-linux"
      --dockerfile "${CI_PROJECT_DIR}/.cicd/build-linux/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}/linux-builder:${CI_COMMIT_TAG}"
  rules:
    - if: $UPDATE_DOCKER_IMAGE == "1"
    #- changes:
    #    - .cicd/build-linux/Dockerfile
    #    - .cicd/build-linux/Toolchain.cmake

apptainer-image-builder:
  stage: build_images
  tags:
    - linux_tahiti_gpu
  needs:
    - job: lint-python
  variables:
    # Put all heavy I/O on the large /data mount
    APPTAINER_TMPDIR: "/data/gitlab-runner/apptainer-tmp"
    APPTAINER_CACHEDIR: "/data/gitlab-runner/apptainer-cache"
  before_script:
    - set -euo pipefail
    - mkdir -p /data/gitlab-runner/apptainer-tmp /data/gitlab-runner/apptainer-cache /data/gitlab-runner/apptainer-images
  script:
    # hash image config
    - DEF_SHA="$(sha256sum .cicd/build-linux/singularity.def | awk '{print $1}')"
    # hash other inputs that should trigger rebuild
    - BLD_FILES_SHA="$(sha256sum .cicd/jobs/build-images.yml .gitlab-ci.yml | awk '{print $1}' | sha256sum | awk '{print $1}')"
    # commit hash of darts-linear-solvers
    - DLS_SHA="$(git ls-remote https://oauth2:${DLS_TOKEN}@gitlab.tudelft.nl/dvoskov/darts-linear-solvers.git HEAD | awk '{print $1}')"
    # combine into BUILD_KEY
    - BUILD_KEY="$(printf '%s\n%s\n%s\n' "$DEF_SHA" "$BLD_FILES_SHA" "$DLS_SHA" | sha256sum | awk '{print $1}')"
    - echo "BUILD_KEY=$BUILD_KEY"
    - IMG_DIR="/data/gitlab-runner/apptainer-images"
    - IMG="$IMG_DIR/open-darts-${BUILD_KEY}.sif"
    # (Optional) quick visibility of space before building
    - df -h "$IMG_DIR" "$(pwd)" /tmp || true
    # build only if not already present (cache/artifacts from previous runs)
    - |    
      if [ -f "$IMG" ]; then
        echo "Reusing cached image $IMG";
      else
        apptainer build --fakeroot \
          --build-arg DLS_TOKEN="${DLS_TOKEN}" \
          --build-arg CUDA_ARCH="70" \
          "$IMG" .cicd/build-linux/singularity.def;
      fi
    - ln -sf "$(basename "$IMG")" "$IMG_DIR/open-darts-latest.sif"
  cache:
    key: "$BUILD_KEY"
    paths:
      - "$IMG"
  rules:
    # if any tracked file changes -> run
    - when: always
  