docker-image-builder:
  stage: build_images
  tags:
    - linux
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  needs: []
  variables:
    # Files whose content determines the Docker image content hash.
    # When any of these files change, the image will be rebuilt.
    # Add space-separated paths here to extend the hash scope.
    DOCKER_HASH_FILES: >-
      ${CI_PROJECT_DIR}/.cicd/build-linux/Dockerfile
      ${CI_PROJECT_DIR}/.cicd/build-linux/Toolchain.cmake
      ${CI_PROJECT_DIR}/.cicd/jobs/build-images.yml
  before_script:
    # Set up registry auth for Kaniko (use username/password fields, not base64 auth)
    - mkdir -p /kaniko/.docker
    - printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}' "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" > /kaniko/.docker/config.json
  script:
    # --- content-hash check (similar to apptainer-image-builder-base) ---
    - echo "Files included in content hash:" ${DOCKER_HASH_FILES}
    - CONTEXT_SHA=$(cat ${DOCKER_HASH_FILES} | sha256sum | awk '{print $1}')
    - BUILD_KEY=$(printf '%.16s' "$CONTEXT_SHA")
    - IMAGE_TAG="sha-${BUILD_KEY}"
    - FULL_IMAGE="${CI_REGISTRY_IMAGE}/linux-builder"
    - echo "Docker context hash => ${IMAGE_TAG}"
    # Check if image with this content hash already exists in registry.
    # Uses crane (bundled in kaniko debug image) with the same docker config
    # that kaniko uses for pushing — more reliable than a manual wget auth check.
    # Probe the registry with /kaniko/warmer (bundled in the kaniko:debug image
    # and sharing the same DOCKER_CONFIG auth as /kaniko/executor). A successful
    # warm means the manifest exists; any non-zero exit means we need to build.
    - |
      NEEDS_BUILD=1
      if [ "${UPDATE_DOCKER_IMAGE:-0}" != "1" ]; then
        if DOCKER_CONFIG=/kaniko/.docker /kaniko/warmer \
             --image="${FULL_IMAGE}:${IMAGE_TAG}" \
             --cache-dir=/tmp/kaniko-probe >/dev/null; then
          echo "Image ${FULL_IMAGE}:${IMAGE_TAG} already exists — skipping build"
          NEEDS_BUILD=0
        else
          echo "Image not found in registry — building..."
        fi
      else
        echo "UPDATE_DOCKER_IMAGE=1 — forcing rebuild"
      fi
    # --- build (only when needed) ---
    - |
      if [ "$NEEDS_BUILD" = "1" ]; then
        DEST_ARGS="--destination=${FULL_IMAGE}:${IMAGE_TAG}"
        if [ "${CI_COMMIT_REF_PROTECTED}" = "true" ]; then
          DEST_ARGS="${DEST_ARGS} --destination=${FULL_IMAGE}:latest"
        fi
        if [ -n "${CI_COMMIT_TAG:-}" ]; then
          DEST_ARGS="${DEST_ARGS} --destination=${FULL_IMAGE}:${CI_COMMIT_TAG}"
        fi
        # On MR branches: validate only, do not push to registry
        # if [ "${CI_PIPELINE_SOURCE}" = "merge_request_event" ] && [ "${CI_COMMIT_REF_PROTECTED}" != "true" ]; then
        #   DEST_ARGS="--no-push"
        # fi
        /kaniko/executor \
          --context "${CI_PROJECT_DIR}/.cicd/build-linux" \
          --dockerfile "${CI_PROJECT_DIR}/.cicd/build-linux/Dockerfile" \
          ${DEST_ARGS} \
          --snapshot-mode=redo \
          --use-new-run \
          --compressed-caching=false
      fi
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/
    - if: $TEST_CUSTOM_BRANCH == "1"
    - if: $TEST_ALL_PYTHONS == "1"
    - if: $UPDATE_DOCKER_IMAGE == "1"

windows-image-builder:
  stage: build_images
  # Windows container images cannot be built by kaniko: they need a Windows host
  # with a Docker daemon in Windows-container mode. This job therefore runs on a
  # shell runner (the only Windows job left that is not itself containerized).
  tags:
    - windows-shell
  timeout: 6h
  needs: []
  variables:
    # Files whose content determines the Docker image content hash.
    # When any of these files change, the image will be rebuilt.
    # Add semicolon-separated paths here to extend the hash scope.
    DOCKER_HASH_FILES: >-
      .cicd/build-windows/Dockerfile;.cicd/jobs/build-images.yml
    IMAGE_NAME: "windows-builder"
    # Python used only to build gmsh inside the image. gmsh's Python API is a
    # ctypes wrapper over gmsh.dll, so this does not constrain the CI matrix
    # (3.10-3.13); each job still creates its own conda env from $PY_VER.
    # Deliberately NOT tied to $DEFAULT_PY_VER: that would force a full
    # Windows image rebuild every time the default Python is bumped.
    GMSH_PY_VER: "3.11"
    DOCKER_BUILD_MEMORY: "10g"
  before_script:
    # Pipe the token instead of passing -p: an argument would be visible in the
    # host process list. The shell runner shares a real machine, so this matters.
    - $env:CI_REGISTRY_PASSWORD | docker login -u $env:CI_REGISTRY_USER --password-stdin $env:CI_REGISTRY
  script:
    # --- content-hash check (mirrors docker-image-builder above) ---
    - |
      # Stop on the first error: a silently skipped hash input would produce a
      # stable tag that no longer tracks image content, so the registry check
      # below would keep matching a stale image and never rebuild.
      $ErrorActionPreference = 'Stop'
      $files = $env:DOCKER_HASH_FILES.Split(';') | Where-Object { $_ -ne '' } | ForEach-Object { $_.Trim() }
      Write-Host "Files included in content hash: $($files -join ' ')"
      $bytes = New-Object System.Collections.Generic.List[byte]
      foreach ($f in $files) {
        # Resolve to an absolute path: .NET methods resolve relative paths against
        # [Environment]::CurrentDirectory, which PowerShell does not keep in sync
        # with $PWD, so ReadAllBytes would look under the runner's start directory.
        $full = (Resolve-Path -LiteralPath $f).Path
        $bytes.AddRange([System.IO.File]::ReadAllBytes($full))
      }
      # Build args affect image content too, so hash them alongside the files.
      $bytes.AddRange([System.Text.Encoding]::UTF8.GetBytes("PY_VER=$env:GMSH_PY_VER"))
      $sha = [System.BitConverter]::ToString(
               [System.Security.Cryptography.SHA256]::Create().ComputeHash($bytes.ToArray())
             ).Replace('-','').ToLower()
      $IMAGE_TAG = "sha-" + $sha.Substring(0,16)
      $FULL_IMAGE = "$env:CI_REGISTRY_IMAGE/$env:IMAGE_NAME"
      Write-Host "Docker context hash => $IMAGE_TAG"
    # Check whether an image with this content hash is already in the registry.
    - |
      $NEEDS_BUILD = $true
      if ($env:UPDATE_DOCKER_IMAGE -ne "1") {
        docker manifest inspect "${FULL_IMAGE}:${IMAGE_TAG}" *> $null
        if ($LASTEXITCODE -eq 0) {
          Write-Host "Image ${FULL_IMAGE}:${IMAGE_TAG} already exists - skipping build"
          $NEEDS_BUILD = $false
        } else {
          Write-Host "Image not found in registry - building..."
        }
      } else {
        Write-Host "UPDATE_DOCKER_IMAGE=1 - forcing rebuild"
      }
    # --- build and push (only when needed) ---
    - |
      if ($NEEDS_BUILD) {
        $tags = @("${FULL_IMAGE}:${IMAGE_TAG}")
        if ($env:CI_COMMIT_REF_PROTECTED -eq "true") { $tags += "${FULL_IMAGE}:latest" }
        if ($env:CI_COMMIT_TAG) { $tags += "${FULL_IMAGE}:$env:CI_COMMIT_TAG" }
        $tagArgs = @()
        foreach ($t in $tags) { $tagArgs += @("-t", $t) }
        docker build -m $env:DOCKER_BUILD_MEMORY --build-arg PY_VER=$env:GMSH_PY_VER $tagArgs -f .cicd/build-windows/Dockerfile .cicd/build-windows
        if ($LASTEXITCODE -ne 0) { throw "docker build failed" }
        foreach ($t in $tags) {
          docker push $t
          if ($LASTEXITCODE -ne 0) { throw "docker push $t failed" }
        }
      }
  after_script:
    - docker logout $env:CI_REGISTRY
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/
    - if: $TEST_CUSTOM_BRANCH == "1"
    - if: $TEST_ALL_PYTHONS == "1"
    - if: $UPDATE_DOCKER_IMAGE == "1"

.apptainer-image-builder-base:
  stage: build_images
  tags:
    - linux_tahiti_gpu
  needs: []
  variables:
    # Put all heavy I/O on the large /data mount
    APPTAINER_TMPDIR: "/data/gitlab-runner/apptainer-tmp"
    APPTAINER_CACHEDIR: "/data/gitlab-runner/apptainer-cache"
    IMG_DIR: "/data/open-darts-apptainer-images"
    # defaults; override in derived jobs
    IMAGE_PREFIX: "open-darts"
    MAX_IMAGE_NUM: "5"
    GITLAB_CI_TOOLS: "0"
  before_script:
    - set -euo pipefail
    - mkdir -p /data/gitlab-runner/apptainer-tmp /data/gitlab-runner/apptainer-cache /data/open-darts-apptainer-images
  script:
    # hash image config
    - DEF_SHA="$(sha256sum .cicd/build-linux/singularity.def | awk '{print $1}')"
    # hash other inputs that should trigger rebuild
    - BLD_FILES_SHA="$(sha256sum .cicd/jobs/build-images.yml .gitlab-ci.yml | awk '{print $1}' | sha256sum | awk '{print $1}')"
    # commit hash of darts-linear-solvers
    - DLS_SHA="$(git ls-remote https://oauth2:${DLS_TOKEN}@gitlab.tudelft.nl/dvoskov/darts-linear-solvers.git HEAD | awk '{print $1}')"
    # combine into BUILD_KEY
    - BUILD_KEY="$(printf '%s\n%s\n%s\n' "$DEF_SHA" "$BLD_FILES_SHA" "$DLS_SHA" | sha256sum | awk '{print $1}')"
    - echo "BUILD_KEY=$BUILD_KEY"
    - IMG="$IMG_DIR/${IMAGE_PREFIX}-${BUILD_KEY}.sif"
    - printf 'APPTAINER_IMAGE=%s\nAPPTAINER_BUILD_KEY=%s\n' "$IMG" "$BUILD_KEY" > apptainer_image.env
    # build only if not already present (cache/artifacts from previous runs)
    - |
      if [ -f "$IMG" ]; then
        if apptainer inspect "$IMG" >/dev/null 2>&1; then
          echo "Reusing cached image $IMG";
        else
          echo "Cached image is corrupted, rebuilding: $IMG"
          rm -f -- "$IMG"
          apptainer build --fakeroot \
            --build-arg ENABLE_DLS="${ENABLE_DLS:-1}" \
            --build-arg DLS_TOKEN="${DLS_TOKEN}" \
            --build-arg CUDA_ARCH="${CUDA_ARCH:-70}" \
            --build-arg ENABLE_AGENT_TOOLS="${ENABLE_AGENT_TOOLS:-0}" \
            "$IMG" .cicd/build-linux/singularity.def;
        fi
      else
        apptainer build --fakeroot \
          --build-arg ENABLE_DLS="${ENABLE_DLS:-1}" \
          --build-arg DLS_TOKEN="${DLS_TOKEN}" \
          --build-arg CUDA_ARCH="${CUDA_ARCH:-70}" \
          --build-arg ENABLE_AGENT_TOOLS="${ENABLE_AGENT_TOOLS:-0}" \
          "$IMG" .cicd/build-linux/singularity.def;
      fi
    - |
      if [ "${CI_COMMIT_BRANCH:-}" = "development" ]; then
        ln -sf "$(basename "$IMG")" "$IMG_DIR/${IMAGE_PREFIX}-latest.sif"
      else
        echo "Skipping latest symlink (branch: ${CI_COMMIT_BRANCH:-})"
      fi
  after_script:
    - |
      set -euo pipefail
      PREFIX="${IMAGE_PREFIX:-open-darts}"
      echo "Checking for old ${PREFIX} images in ${IMG_DIR}..."
      LATEST_LINK="$IMG_DIR/${PREFIX}-latest.sif"
      LATEST_TARGET=""
      if [ -L "$LATEST_LINK" ]; then
        LATEST_TARGET="$(readlink -f "$LATEST_LINK" || true)"
        if [ -n "$LATEST_TARGET" ]; then
          echo "Will keep latest symlink target: $LATEST_TARGET"
        fi
      fi
      # Build a list of matching regular files (excluding the 'latest' symlink), oldest first
      TMP_LIST="$(mktemp)"
      find "$IMG_DIR" -maxdepth 1 -type f -name "${PREFIX}-*.sif" ! -name "${PREFIX}-latest.sif" -printf '%T@ %p\n' | sort -n | awk '{ $1=""; sub(/^ /,""); print }' > "$TMP_LIST"
      TOTAL="$(wc -l < "$TMP_LIST" | tr -d ' ')"
      MAX="${MAX_IMAGE_NUM:-5}"
      if [ "${TOTAL:-0}" -le "$MAX" ]; then
        echo "No pruning needed: $TOTAL image(s) present (<= $MAX)."
      else
        TO_DELETE="$(( TOTAL - MAX ))"
        echo "Pruning $TO_DELETE oldest image(s) with prefix ${PREFIX}"
        DELETED=0
        while IFS= read -r IMG_PATH; do
          if [ "$DELETED" -ge "$TO_DELETE" ]; then
            break
          fi
          if [ -n "$LATEST_TARGET" ] && [ "$IMG_PATH" = "$LATEST_TARGET" ]; then
            echo "Keeping latest target $IMG_PATH"
            continue
          fi
          echo "Removing $IMG_PATH"
          rm -f -- "$IMG_PATH" || true
          DELETED=$(( DELETED + 1 ))
        done < "$TMP_LIST"
      fi
      rm -f "$TMP_LIST" || true
  cache:
    key: "$BUILD_KEY"
    paths:
      - "$IMG"
  artifacts:
    reports:
      dotenv: apptainer_image.env
    paths:
      - apptainer_image.env

apptainer-image-builder:
  extends: .apptainer-image-builder-base
  variables:
    IMAGE_PREFIX: "open-darts"
    ENABLE_AGENT_TOOLS: "0"
  rules:
      - if: $MCP_TRIGGER_TAHITI_GPU == "1"
        when: never
      - if: $CI_COMMIT_REF_PROTECTED == "true"
      - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/
      - if: $TEST_CUSTOM_BRANCH == "1"
      - if: $TEST_ALL_PYTHONS == "1"


