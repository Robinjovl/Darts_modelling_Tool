clean-windows:
    stage: pre_commit
    tags:
        - windows-shell
    variables:
        DARTS_CONDA_ENVS_PATH: 'D:\miniconda3\envs\darts-win*'
        FLASH_CONDA_ENVS_PATH: 'D:\miniconda3\envs\flash-win*'
    script:
        # Force-remove directory if conda left trash behind (from the previous pipelines)
        - Remove-Item -Recurse -Force $env:DARTS_CONDA_ENVS_PATH -ErrorAction SilentlyContinue
        - Remove-Item -Recurse -Force $env:FLASH_CONDA_ENVS_PATH -ErrorAction SilentlyContinue
