gitingest-digest:
    stage: ingest
    tags:
        - linux_tahiti_gpu
    needs: []
    variables:
        # Python to use for the temporary environment
        PY_VER: "$DEFAULT_PY_VER"
        # Unique conda env name per job to avoid collisions on shared runners
        CONDA_ENV: "gitingest_${CI_JOB_ID}"
        CONDAPATH: /data/gitlab-runner/miniconda3
        # Optional manifest file (one path per line; lines starting with # are comments)
        GITINGEST_MANIFEST: "helper_scripts/gitingest-include.txt"
        # Output directory and filename prefix for the digest
        GITINGEST_OUT_DIR: "digest"
        GITINGEST_OUTPUT_PREFIX: "open-darts-digest"
        GITINGEST_MODELS_OUTPUT_PREFIX: "open-darts-models"
    before_script:
        - set -euo pipefail
        # Prepare Python env on Tahiti runner (same pattern as GPU tests)
        - spack env activate open_darts_gcc134 || true
        - . "${CONDAPATH}/etc/profile.d/conda.sh"
        - conda env remove -n ${CONDA_ENV} -y || true
        - conda create -n ${CONDA_ENV} python=${PY_VER} -q -y
        - conda activate ${CONDA_ENV}
        - python -m pip install --upgrade pip
        # Fail fast: a missing gitingest CLI previously caused the job to
        # silently skip digest generation while still reporting success.
        - pip install --upgrade gitingest
    script:
        - set -euo pipefail
        - mkdir -p "${GITINGEST_OUT_DIR}" "${GITINGEST_OUT_DIR}/src"
        - COMMIT_HASH="${CI_COMMIT_SHORT_SHA:-${CI_COMMIT_SHA:-local}}"
        - GITINGEST_OUTPUT="${GITINGEST_OUT_DIR}/${GITINGEST_OUTPUT_PREFIX}-${COMMIT_HASH}.json"
        - MODELS_GITINGEST_OUTPUT="${GITINGEST_OUT_DIR}/${GITINGEST_MODELS_OUTPUT_PREFIX}-${COMMIT_HASH}.json"
        - export GITINGEST_OUTPUT MODELS_GITINGEST_OUTPUT COMMIT_HASH
        - echo "Resolved include list:"
        - grep -vE '^(#|[[:space:]]*$)' "${GITINGEST_MANIFEST}" | sort -u
          # Validate and copy files preserving directory structure
        - MISSING=0
        - |
          while IFS= read -r relpath; do
            [ -z "$relpath" ] && continue
            [ "${relpath#\#}" != "$relpath" ] && continue  # skip comments
            if [ -e "$relpath" ]; then
              mkdir -p "${GITINGEST_OUT_DIR}/src/$(dirname "$relpath")"
              # Prefer --parents when available
              cp --parents -a "$relpath" "${GITINGEST_OUT_DIR}/src" 2>/dev/null || cp -a "$relpath" "${GITINGEST_OUT_DIR}/src/$relpath"
            else
              echo "WARN: missing path: $relpath" >&2
              MISSING=$((MISSING+1))
            fi
          done < <(grep -vE '^(#|[[:space:]]*$)' "${GITINGEST_MANIFEST}" | sort -u)
        - |
          if [ "$MISSING" -gt 0 ]; then
            echo "There were $MISSING missing paths (continuing)." >&2
          fi
          # Run gitingest with an explicit output path (-o). This replaces the
          # previous CWD-digest.txt discovery dance, whose sed fallback carried
          # broken quoting and could pick up a stale digest from an earlier run.
          # NOTE: the output keeps its historical *.json name for downstream
          # auto-detect compatibility, but the CONTENT is gitingest TEXT format
          # (the downstream GitIngestParser is extension-agnostic; validated
          # locally 2026-06-11: 65 files parsed losslessly).
        - |
          echo "Running gitingest CLI..."
          gitingest "${GITINGEST_OUT_DIR}/src" -o "${GITINGEST_OUTPUT}" \
            > "${GITINGEST_OUT_DIR}/gitingest-output.txt" \
            2> "${GITINGEST_OUT_DIR}/gitingest-stderr.txt"
          test -s "${GITINGEST_OUTPUT}" || {
            echo "ERROR: main digest was not produced at ${GITINGEST_OUTPUT}" >&2
            tail -n 20 "${GITINGEST_OUT_DIR}/gitingest-stderr.txt" >&2 || true
            exit 1
          }
        - echo "Digest preparation completed."
        - |
          echo "Preparing models subfolders (*.py) for second gitingest..."
          if [ -d models ]; then
            mkdir -p "${GITINGEST_OUT_DIR}/models_src"
            MISSING_MODELS=0
            while IFS= read -r relpath; do
              [ -z "$relpath" ] && continue
              if [ -e "$relpath" ]; then
                mkdir -p "${GITINGEST_OUT_DIR}/models_src/$(dirname "$relpath")"
                cp --parents -a "$relpath" "${GITINGEST_OUT_DIR}/models_src" 2>/dev/null || cp -a "$relpath" "${GITINGEST_OUT_DIR}/models_src/$relpath"
              else
                echo "WARN: missing models path: $relpath" >&2
                MISSING_MODELS=$((MISSING_MODELS+1))
              fi
            done < <(find models -mindepth 2 -type f -name "*.py" | sort)
            echo "Running second gitingest on models_src..."
            # Explicit -o avoids the stale-digest.txt leak: previously a failed
            # second run could silently ship the FIRST digest as the models one.
            gitingest "${GITINGEST_OUT_DIR}/models_src" -o "${MODELS_GITINGEST_OUTPUT}" \
              > "${GITINGEST_OUT_DIR}/gitingest-models-output.txt" \
              2> "${GITINGEST_OUT_DIR}/gitingest-models-stderr.txt"
            test -s "${MODELS_GITINGEST_OUTPUT}" || {
              echo "ERROR: models digest was not produced at ${MODELS_GITINGEST_OUTPUT}" >&2
              tail -n 20 "${GITINGEST_OUT_DIR}/gitingest-models-stderr.txt" >&2 || true
              exit 1
            }
          else
            echo "WARN: 'models' directory not found; skipping models digest generation." >&2
          fi
    after_script:
        # Cleanup conda env and export metadata for the next job
        - spack env activate open_darts_gcc134 || true
        - . "${CONDAPATH}/etc/profile.d/conda.sh"
        - conda env remove -n ${CONDA_ENV} -y || true
        - echo "OPEN_DARTS_GITINGEST_JOB_ID=${CI_JOB_ID}" > gitingest.env
        - echo "OPEN_DARTS_REF=${CI_COMMIT_REF_NAME}" >> gitingest.env
        - echo "OPEN_DARTS_COMMIT_SHA=${CI_COMMIT_SHA}" >> gitingest.env
    rules:
        - if: $CI_PIPELINE_SOURCE == "pipeline"
          when: never
        - if: $CI_COMMIT_BRANCH == "development" && $ENABLE_GITINGEST == "1"
          when: on_success
        - when: never
    artifacts:
        paths:
            - "digest/open-darts-digest-*.json"
            - "digest/open-darts-models-*.json"
            - "digest/gitingest-output.txt"
            - "digest/gitingest-stderr.txt"
            - "digest/gitingest-models-output.txt"
            - "digest/gitingest-models-stderr.txt"
        reports:
          dotenv: gitingest.env
        when: always
        expire_in: 1 week

trigger-mcp-ingest:
    stage: ingest
    needs: ["gitingest-digest"]
    trigger:
        project: open-darts/mcp-server
        branch: main
        strategy: depend
        forward:
            pipeline_variables: true
    variables:
        OPEN_DARTS_PROJECT_ID: "$CI_PROJECT_ID"
        OPEN_DARTS_PIPELINE_ID: "$CI_PIPELINE_ID"
        OPEN_DARTS_COMMIT_SHA: "$CI_COMMIT_SHA"
        OPEN_DARTS_REF: "$CI_COMMIT_REF_NAME"
        OPEN_DARTS_GITINGEST_JOB_NAME: "gitingest-digest"
        # pulled from dotenv produced by previous job:
        OPEN_DARTS_GITINGEST_JOB_ID: "$OPEN_DARTS_GITINGEST_JOB_ID"
        # Instruct downstream to run only ingest job
        MCP_INGEST_ONLY: "1"
    rules:
        - if: $CI_PIPELINE_SOURCE == "pipeline"
          when: never
        - if: $CI_COMMIT_BRANCH == "development" && $ENABLE_GITINGEST == "1"
          when: on_success
        - when: never

assemble-model-references-tahiti-gpu:
    stage: ingest
    tags:
        - linux_tahiti_gpu
    needs: []
    variables:
        MODEL_REFERENCES_OUT_DIR: "digest"
        MODEL_REFERENCE_PKL_PATTERNS: |
            */ref/*gpu*.pkl
        # Model-local input decks that sit next to the *.json config and are
        # referenced from it by a relative path — e.g. black-oil PVT tables via
        # "pvt_path": "physics.in" (models/3ph_bo). Collected at model-dir depth
        # ONLY (see the -mindepth 2 -maxdepth 2 find below): a recursive match
        # would wrongly pull large/duplicate mesh decks (e.g. the multi-MB
        # cpg_sloping_fault/meshes/*/grid.grdecl and *.in) and output noise.
        MODEL_REFERENCE_INPUT_PATTERNS: |
            *.in
            *.grdecl
        # Model source files (main.py / model.py / reservoir.py …) — the
        # whole-model exemplars the D3 code-generation retrieval corpus grounds
        # on. Depth-2 only, matching the JSON/deck rule (a recursive match would
        # pull vendored/utility trees and inflate the artifact).
        MODEL_REFERENCE_PY_PATTERNS: |
            *.py
    script:
        - set -euo pipefail
        - mkdir -p "${MODEL_REFERENCES_OUT_DIR}/models"
        - PKL_MATCHES_FILE="$(mktemp)"
        - JSON_MATCHES_FILE="$(mktemp)"
        - INPUT_MATCHES_FILE="$(mktemp)"
        - PY_MATCHES_FILE="$(mktemp)"
        - trap 'rm -f "${PKL_MATCHES_FILE}" "${JSON_MATCHES_FILE}" "${INPUT_MATCHES_FILE}" "${PY_MATCHES_FILE}"' EXIT
        - |
          while IFS= read -r pattern; do
            [ -z "$pattern" ] && continue
            [ "${pattern#\#}" != "$pattern" ] && continue
            find models -type f -path "$pattern"
          done <<EOF | sort -u > "${PKL_MATCHES_FILE}"
          ${MODEL_REFERENCE_PKL_PATTERNS}
          EOF
        - find models -mindepth 2 -maxdepth 2 -type f -name "*.json" | sort -u > "${JSON_MATCHES_FILE}"
        # Model-local input decks (e.g. models/3ph_bo/physics.in) — depth-2 only.
        - |
          while IFS= read -r pattern; do
            [ -z "$pattern" ] && continue
            [ "${pattern#\#}" != "$pattern" ] && continue
            find models -mindepth 2 -maxdepth 2 -type f -name "$pattern"
          done <<EOF | sort -u > "${INPUT_MATCHES_FILE}"
          ${MODEL_REFERENCE_INPUT_PATTERNS}
          EOF
        # Model source files (D3 exemplars, e.g. models/2ph_do/model.py) — depth-2 only.
        - |
          while IFS= read -r pattern; do
            [ -z "$pattern" ] && continue
            [ "${pattern#\#}" != "$pattern" ] && continue
            find models -mindepth 2 -maxdepth 2 -type f -name "$pattern"
          done <<EOF | sort -u > "${PY_MATCHES_FILE}"
          ${MODEL_REFERENCE_PY_PATTERNS}
          EOF
        - GPU_PKL_COUNT="$(wc -l < "${PKL_MATCHES_FILE}")"
        - JSON_CONFIG_COUNT="$(wc -l < "${JSON_MATCHES_FILE}")"
        - INPUT_DECK_COUNT="$(wc -l < "${INPUT_MATCHES_FILE}")"
        - PY_FILE_COUNT="$(wc -l < "${PY_MATCHES_FILE}")"
        - |
          while IFS= read -r relpath; do
            [ -z "$relpath" ] && continue
            mkdir -p "${MODEL_REFERENCES_OUT_DIR}/$(dirname "$relpath")"
            cp --parents -a "$relpath" "${MODEL_REFERENCES_OUT_DIR}" 2>/dev/null || cp -a "$relpath" "${MODEL_REFERENCES_OUT_DIR}/$relpath"
          done < "${PKL_MATCHES_FILE}"
        - |
          while IFS= read -r relpath; do
            [ -z "$relpath" ] && continue
            mkdir -p "${MODEL_REFERENCES_OUT_DIR}/$(dirname "$relpath")"
            cp --parents -a "$relpath" "${MODEL_REFERENCES_OUT_DIR}" 2>/dev/null || cp -a "$relpath" "${MODEL_REFERENCES_OUT_DIR}/$relpath"
          done < "${JSON_MATCHES_FILE}"
        - |
          while IFS= read -r relpath; do
            [ -z "$relpath" ] && continue
            mkdir -p "${MODEL_REFERENCES_OUT_DIR}/$(dirname "$relpath")"
            cp --parents -a "$relpath" "${MODEL_REFERENCES_OUT_DIR}" 2>/dev/null || cp -a "$relpath" "${MODEL_REFERENCES_OUT_DIR}/$relpath"
          done < "${INPUT_MATCHES_FILE}"
        - |
          while IFS= read -r relpath; do
            [ -z "$relpath" ] && continue
            mkdir -p "${MODEL_REFERENCES_OUT_DIR}/$(dirname "$relpath")"
            cp --parents -a "$relpath" "${MODEL_REFERENCES_OUT_DIR}" 2>/dev/null || cp -a "$relpath" "${MODEL_REFERENCES_OUT_DIR}/$relpath"
          done < "${PY_MATCHES_FILE}"
        - |
          cat "${PKL_MATCHES_FILE}" "${JSON_MATCHES_FILE}" "${INPUT_MATCHES_FILE}" "${PY_MATCHES_FILE}" | sort -u > "${MODEL_REFERENCES_OUT_DIR}/models/_collected-files.txt"
          echo "Collected ${GPU_PKL_COUNT} GPU reference PKL files."
          echo "Collected ${JSON_CONFIG_COUNT} JSON model configs."
          echo "Collected ${INPUT_DECK_COUNT} model input decks (*.in / *.grdecl)."
          echo "Collected ${PY_FILE_COUNT} model source files (*.py)."
          test "${GPU_PKL_COUNT}" -gt 0
          test "${JSON_CONFIG_COUNT}" -gt 0
    rules:
        - if: $MCP_TRIGGER_TAHITI_GPU == "1" && $MCP_TAHITI_GPU_TARGET == "model_refs"
        - when: never
    artifacts:
        paths:
            - "digest/models/"
        when: always
        expire_in: 1 week
