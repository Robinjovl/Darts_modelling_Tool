.build-windows:
    stage: build
    # Runs inside the Windows builder container (MSVC Build Tools, CMake, conda,
    # git and a headless gmsh are all baked into the image - see
    # .cicd/build-windows/Dockerfile). Requires a runner with the
    # docker-windows executor whose host OS matches the image base.
    image: "${WINDOWS_BUILDER_IMAGE}"
    tags:
        - windows_docker
    variables:
        CONDA_ENV: "darts-win"
        CONDA_BIN_PATH: 'C:\conda\condabin'
        # MINIMAL drops the linear adaptive interpolator from the compile set,
        # cutting cc1plus / cl.exe memory enough that the windows CI runners do
        # not OOM on the heavy py_operator_set_interpolator_*_part*.cpp TUs.
        # build_darts_cmake.bat forwards OD_CMAKE_ARGS to cmake.
        OD_CMAKE_ARGS: "-D OPENDARTS_INTERPOLATOR_PROFILE=MINIMAL"
    before_script:
        # Load the MS Build Tools environment into this PowerShell session.
        # The docker-windows executor bypasses the image ENTRYPOINT, so vcvars
        # has to be imported explicitly.
        - .\helper_scripts\build_vars.ps1
        - if (-not ($env:PATH.Split(';') -contains $env:CONDA_BIN_PATH)) { $env:PATH = "$env:CONDA_BIN_PATH;$env:PATH" }
        - $condaRoot = Split-Path $env:CONDA_BIN_PATH -Parent
        - $condaHookPath = Join-Path $condaRoot 'shell\condabin\conda-hook.ps1'
        - if (Test-Path $condaHookPath) { (& $condaHookPath) | Out-Null }
        # Initialize conda environment
        - conda create --name $env:CONDA_ENV python=$env:PY_VER --yes -q
        - conda activate $env:CONDA_ENV
        # Make sure wheel package could be installed
        - python -m pip install --upgrade pip setuptools wheel
    script:
        # Copy VS redist libraries
        - copy $env:VCToolsRedistDir\x64\Microsoft.VC143.CRT\msvcp140.dll .\darts
        - copy $env:VCToolsRedistDir\x64\Microsoft.VC143.CRT\vcruntime140.dll .\darts
        - copy $env:VCToolsRedistDir\x64\Microsoft.VC143.OpenMP\vcomp140.dll .\darts
        - echo "ODLS:" $env:ODLS
        # Compile and make the wheel
        - .\helper_scripts\build_darts_cmake.bat $env:ODLS -c -w -t -j 8 -p
        # Install open-darts, passing gmsh explicitly so it is (re)installed
        # cleanly alongside the package (see .cicd/build-windows/readme.txt).
        # The headless gmsh baked into the image stays ahead of the PyPI one
        # on PYTHONPATH, so that is the one actually imported at runtime.
        - python -m pip install . --ignore-installed gmsh
        # Check for warnings
        - |
          $match = Select-String -Path make_darts.log -Pattern 'OPENDARTS_WARNING_COUNT=(\d+)' | Select-Object -Last 1
          $warnCount = if ($match) { [int]$match.Matches[0].Groups[1].Value } else { 0 }
          if ($warnCount -gt 0 -and ($env:CI_COMMIT_BRANCH -eq "development" -or $env:CI_COMMIT_BRANCH -eq "main")) {
            Write-Host "FAILED: $warnCount open-DARTS compilation warning(s) on $($env:CI_COMMIT_BRANCH) branch"
            exit 1
          }
    needs:
    - job: windows-image-builder
      optional: true
    artifacts:
      paths:
        - '*.log'
        - '.\dist\*.whl'
      expire_in: 1 week
      when: always

build-windows:
    extends: .build-windows
    rules: &python_version_rules
        - if: '$PY_VER == $DEFAULT_PY_VER && ($CI_COMMIT_REF_PROTECTED == "true" || $CI_PIPELINE_SOURCE == "merge_request_event" || $TEST_CUSTOM_BRANCH == "1")'
        - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/
        - if: $TEST_ALL_PYTHONS == "1"
    variables:
        ODLS: '-a'
    parallel:
        matrix:
            - PY_VER: '3.10'
            - PY_VER: '3.11'
            - PY_VER: '3.12'
            - PY_VER: '3.13'

build-windows-ODLS:
    extends: .build-windows
    rules: *python_version_rules
    variables:
        ODLS: ''         # build with open-darts linear solvers
    parallel:
        matrix:
            - PY_VER: '3.10'
            - PY_VER: '3.11'
            - PY_VER: '3.12'
            - PY_VER: '3.13'
