.build-windows:
    stage: build
    # Will be executed on runner with windows shell tag - that assumed to run on windows host with shell executor
    tags:
        - windows-shell
    needs: []
    variables:
        CONDA_BASE: 'D:\miniconda3'
        CONDA_ENV: "darts-win-${CI_JOB_ID}"
    script:
        # Load MS Build Tools environment to the powershell
        - $prevEAP = $ErrorActionPreference
        - $ErrorActionPreference = 'Continue'   # build_vars.ps1 emits benign Set-Content warnings
        - D:\BuildTools\build_vars.ps1
        - $ErrorActionPreference = $prevEAP
        # Bootstrap Miniconda env
        - if (-not $env:CONDA_BASE) { $env:CONDA_BASE = 'D:\miniconda3' }
        - $condaExe = Join-Path $env:CONDA_BASE 'Scripts\conda.exe'
        - if (-not (Test-Path $condaExe)) { throw "Unable to find conda executable at $condaExe" }
        - Write-Host "Using Miniconda root $env:CONDA_BASE and env $env:CONDA_ENV"
        - (& $condaExe "shell.powershell" "hook") | Out-String | Invoke-Expression
        - $env:CONDA_ENV_PATH = Join-Path $env:CONDA_BASE ('envs\' + $env:CONDA_ENV)
        - if (Test-Path $env:CONDA_ENV_PATH) { conda env remove --name $env:CONDA_ENV --yes }
        - conda create --name $env:CONDA_ENV python=$env:PY_VER --yes -q
        - conda activate $env:CONDA_ENV
        - $env:PY_SUFFIX=python -c "import importlib.machinery; print(importlib.machinery.EXTENSION_SUFFIXES[0])"
        # make sure wheel package could be installed
        - python -m pip install --upgrade pip setuptools wheel
        # copy VS redist libraries
        - copy $env:VCToolsRedistDir\x64\Microsoft.VC143.CRT\msvcp140.dll .\darts
        - copy $env:VCToolsRedistDir\x64\Microsoft.VC143.CRT\vcruntime140.dll .\darts
        - copy $env:VCToolsRedistDir\x64\Microsoft.VC143.OpenMP\vcomp140.dll .\darts
        - echo "ODLS:" $env:ODLS
        # compile and make the wheel
        - .\helper_scripts\build_darts_cmake.bat $env:ODLS -c -w -t -j 8 -p
        - if (Get-Command conda -ErrorAction SilentlyContinue) { conda deactivate }
    after_script:
        - if (-not $env:CONDA_BASE) { $env:CONDA_BASE = 'D:\miniconda3' }
        - $condaExe = Join-Path $env:CONDA_BASE 'Scripts\conda.exe'
        - if ($env:CONDA_ENV) { $envPath = Join-Path $env:CONDA_BASE ('envs\' + $env:CONDA_ENV); if ((Test-Path $condaExe) -and (Test-Path $envPath)) { & $condaExe env remove --name $env:CONDA_ENV --yes } else { Write-Host "Conda cleanup skipped (env missing)" } }
    artifacts:
      paths:
        - '*.log'
        - '.\dist\*.whl'
      expire_in: 1 week
      when: always

build-windows-3.13:
    rules:
        - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/
        - if: $TEST_ALL_PYTHONS == "1"
    extends: .build-windows
    variables:
        PY_VER: '3.13'
        ODLS: '-a'

