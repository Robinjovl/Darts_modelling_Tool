.build-linux:
    stage: build
    image: "${CI_REGISTRY_IMAGE}/linux-builder"
    # Will be executed on runner with linux tag - that assumed to run on linux host
    tags:
        - linux
    variables:
        CONDA_ENV: "darts-${CI_JOB_ID}"
        # Compile linear interpolators and support up to 12 engine components.
        # The build is serialized below to constrain memory use on the
        # template-heavy interpolator translation units.
        OD_CMAKE_ARGS: "-DOPENDARTS_INTERPOLATOR_PROFILE=FULL -DOPENDARTS_MAX_DIMS=12"
    before_script:
        - echo 'before build-linux'
        - source /opt/conda/bin/activate
        - conda create -n ${CONDA_ENV} python=${PY_VER} --yes
        - conda activate ${CONDA_ENV}
        - export PY_SUFFIX=`python -c "import importlib.machinery; print(importlib.machinery.EXTENSION_SUFFIXES[0])"`
        - python -m pip install --upgrade pip setuptools wheel
    script:
        - echo "build *.so on linux started with ODLS=$ODLS"
        - ./helper_scripts/build_darts_cmake.sh -c -w -t -m -j 1 $ODLS -p
        - grep -q '^OPENDARTS_INTERPOLATOR_PROFILE:STRING=FULL$' build/CMakeCache.txt
        - grep -q '^OPENDARTS_MAX_DIMS:STRING=12$' build/CMakeCache.txt
    after_script:
        - source /opt/conda/bin/activate
        - conda env remove -n ${CONDA_ENV} --yes || true
    needs:
    - job: docker-image-builder
      optional: true
    artifacts:
      paths:
        - './dist/*.whl'
        - '*.log'
      expire_in: 1 week
      when: always
