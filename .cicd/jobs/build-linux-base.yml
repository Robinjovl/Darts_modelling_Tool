.build-linux:
    stage: build
    image: "${CI_REGISTRY_IMAGE}/linux-builder"
    # Will be executed on runner with linux tag - that assumed to run on linux host
    tags:
        - linux
    variables:
        CONDA_ENV: "darts-${CI_JOB_ID}"
        CCACHE_DIR: "${CI_PROJECT_DIR}/.ccache"
        CCACHE_BASEDIR: "${CI_PROJECT_DIR}"
        CCACHE_COMPILERCHECK: "content"
        CCACHE_MAXSIZE: "2G"
        CCACHE_SLOPPINESS: "pch_defines,time_macros"
    cache:
      - key: "ccache-linux-${CI_JOB_NAME}"
        paths:
          - .ccache/
      - key: "build-linux-${CI_JOB_NAME}-${CI_COMMIT_REF_SLUG}"
        fallback_keys:
          - "build-linux-${CI_JOB_NAME}-main"
        paths:
          - build/
    before_script:
        - echo 'before build-linux'
        - source /opt/conda/bin/activate
        - conda create -n ${CONDA_ENV} python=${PY_VER} --yes
        - conda activate ${CONDA_ENV}
        - export PY_SUFFIX=`python -c "import importlib.machinery; print(importlib.machinery.EXTENSION_SUFFIXES[0])"`
        - python -m pip install --upgrade pip setuptools wheel
        - |
          if command -v ccache >/dev/null 2>&1; then
            export OD_CMAKE_ARGS="-D CMAKE_C_COMPILER_LAUNCHER=ccache -D CMAKE_CXX_COMPILER_LAUNCHER=ccache"
            ccache --zero-stats
          else
            echo "ccache not found — building without compiler cache"
          fi
    script:
        - echo "build *.so on linux started with ODLS=$ODLS"
        - ./helper_scripts/build_darts_cmake.sh -w -t -m -j 8 $ODLS -p
        - ccache --show-stats || true
    after_script:
        - source /opt/conda/bin/activate
        - conda env remove -n ${CONDA_ENV} --yes || true
    needs:
    - job: docker-image-builder
      optional: true
    artifacts:
      paths:
        - './dist/*.whl'
        - '*.log'
      expire_in: 1 week
      when: always
