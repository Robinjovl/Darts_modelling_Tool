include:
  - local: '.cicd/jobs/valgrind-check.yml'

tsan-check:
    extends: .linux-profiler-base
    rules:
        # Skip on .pkl reference-upload runs (build-linux-tsan is also
        # skipped there, and this job needs it): matches valgrind-check.
        - if: $UPLOAD_PKL == "1"
          when: never
        - if: $CHECK_DATA_RACES == "1"
    needs:
        - build-linux-tsan
    script:
        - apt-get update -qq && apt-get install -y -qq libtsan0
        - echo ">>> Running ThreadSanitizer data-race check <<<"
        - python helper_scripts/tsan_check.py
    artifacts:
      paths:
        - models/_tsan_logs/*.log
        - models/_tsan_logs/*.summary.txt
      when: always
      expire_in: 1 week
