include:
  - local: '.cicd/jobs/build-linux-base.yml'

build-linux:
    extends: .build-linux
    rules: &python_version_rules
        - if: '$PY_VER == "3.10" && ($CI_COMMIT_REF_PROTECTED == "true" || $CI_PIPELINE_SOURCE == "merge_request_event" || $TEST_CUSTOM_BRANCH == "1")'
        - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/
        - if: $TEST_ALL_PYTHONS == "1"
    variables:
        ODLS: '-a'
    parallel:
        matrix:
            - PY_VER: '3.10'
            - PY_VER: '3.11'
            - PY_VER: '3.12'
            - PY_VER: '3.13'

build-linux-ODLS:
    extends: .build-linux
    rules: *python_version_rules
    variables:
        ODLS: ''              # build with open-darts linear solvers
    parallel:
        matrix:
            - PY_VER: '3.10'
            - PY_VER: '3.11'
            - PY_VER: '3.12'
            - PY_VER: '3.13'
