include:
  - local: '.cicd/jobs/build-linux-base.yml'

# Linux CPU builds. The unsuffixed `build-linux` is the in-tree open-source
# solvers (formerly "build-linux-ODLS"); `build-linux-BOS` is the proprietary
# BOS-solvers twin (formerly the unsuffixed build-linux). See MR280_MASTER_PLAN.md §F.
build-linux:
    extends: .build-linux
    rules: &python_version_rules
        - if: '$PY_VER == $DEFAULT_PY_VER && ($CI_COMMIT_REF_PROTECTED == "true" || $CI_PIPELINE_SOURCE == "merge_request_event" || $TEST_CUSTOM_BRANCH == "1")'
        - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/
        - if: $TEST_ALL_PYTHONS == "1"
    variables:
        ODLS: ''              # in-tree open-darts linear solvers (open-source)
    parallel:
        matrix:
            - PY_VER: '3.10'
            - PY_VER: '3.11'
            - PY_VER: '3.12'
            - PY_VER: '3.13'

# Proprietary BOS-solvers build (ENABLE_BOS_SOLVERS=ON, via the `-a` build-script
# flag -> BOS_SOLVERS_DIR=engines/lib/darts_linear_solvers).
build-linux-BOS:
    extends: .build-linux
    rules: *python_version_rules
    variables:
        ODLS: '-a'           # proprietary BOS linear solvers (ENABLE_BOS_SOLVERS=ON)
    parallel:
        matrix:
            - PY_VER: '3.10'
            - PY_VER: '3.11'
            - PY_VER: '3.12'
            - PY_VER: '3.13'
