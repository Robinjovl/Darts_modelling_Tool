.test-linux-gpu:
    stage: test
    script:
        # run simulation fot test models set
        - cd models
        # passing additional argument LOG to trigger verbose check performance
        - systemd-run --scope -p MemoryMax=30000M -p MemoryHigh=20000M --user darts run_test_suite2.py LOG
        - echo "run_test_suite2 returned" $?
        - cd ..
        # test discretizer
        - cd discretizer/tests/compare_discretizers
        - python main.py
        - cd ../../..
        #
        - echo "test finished"
    after_script:
        - &archive_logic
            - cd models
            - ./archive_pkl.sh $ODLS $TEST_GPU
            - cd ..
    rules:
        - if: $CI_COMMIT_REF_PROTECTED == "true"
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/
        - if: $TEST_CUSTOM_BRANCH == "1"
    variables:
        ODLS: '-a'
        TEST_GPU: '1'
        PY_VER: $DEFAULT_PY_VER
        CONDA_ENV: "darts_gpu_${CI_JOB_ID}"
    artifacts:
      paths:
        - './models/_logs/*.log'
        - './models/chemistry/_logs/chemistry/*.log'
        - './models/fracture_network/meshes*/*.log'
        - './models/displaced_fault_reactivation/meshes/*.log'
        - './models/pkl_lin.tar.gz'
      expire_in: 1 day
      when: always

test-linux-oahu-gpu:
    tags:
        - linux_gpu
    variables:
        CONDAPATH: /oahu/data/gitlabrunner/anaconda3
    before_script:
        - module load cuda/23.5
        - source ${CONDAPATH}/bin/activate
        - conda create -n ${CONDA_ENV} python=${PY_VER} --yes
        - conda activate ${CONDA_ENV}
        # upgrade pip package first
        - python -m pip install --upgrade pip
        - pip uninstall open-darts-flash  --yes
        - pip install ./dist/*.whl
    after_script:
        - *archive_logic  # parent's commands
        - source ${CONDAPATH}/bin/activate
        - conda env remove -n ${CONDA_ENV} -y || true
    extends: .test-linux-gpu
    needs:
        - build-linux-oahu-gpu

.test-linux-tahiti-gpu:
    tags:
        - linux_tahiti_gpu
    extends: .test-linux-gpu
    variables:
        CONDAPATH: /data/gitlab-runner/miniconda3
    before_script:
        - spack env activate open_darts_gcc134
        - . "${CONDAPATH}/etc/profile.d/conda.sh"
        - conda create -n ${CONDA_ENV} python=${PY_VER} -q -y
        - conda activate ${CONDA_ENV}
        # upgrade pip package first
        - python -m pip install --upgrade pip
        - pip uninstall open-darts-flash --yes
        - pip install ./dist/*.whl
    after_script:
        - spack env activate open_darts_gcc134
        - . "${CONDAPATH}/etc/profile.d/conda.sh"
        - conda env remove -n ${CONDA_ENV} -y || true
    needs:
        - build-linux-tahiti-gpu

test-linux-tahiti-image-gpu:
    tags:
        - linux_tahiti_gpu
    extends: .test-linux-gpu
    before_script:
        - |
          set -euo pipefail
          if [ -z "${APPTAINER_IMAGE:-}" ]; then
            echo "APPTAINER_IMAGE is not set (expected from apptainer-image-builder dotenv artifact)"
            exit 1
          fi
          if [ ! -f "$APPTAINER_IMAGE" ]; then
            echo "Apptainer image does not exist: $APPTAINER_IMAGE"
            ls -la /data/open-darts-apptainer-images || true
            exit 1
          fi
          echo "Using Apptainer image: $APPTAINER_IMAGE"
        - |
          apptainer exec --nv "$APPTAINER_IMAGE" bash -lc "
            # exit on any error, print commands as you go
            set -euxo pipefail && \
            # enable Conda in this shell
            source /opt/conda/etc/profile.d/conda.sh && \
            conda create -n ${CONDA_ENV} python=${PY_VER} -q -y && \
            # activate your env
            conda activate ${CONDA_ENV} && \
            # make sure pip is fresh and reinstall your wheel
            python -m pip install --upgrade pip && \
            pip uninstall open-darts-flash --yes && \
            pip install ./dist/*.whl --force-reinstall
            "
    script:
        - |
          apptainer exec --nv "$APPTAINER_IMAGE" bash -lc "
            set -euxo pipefail && \
            source /opt/conda/etc/profile.d/conda.sh && \
            conda activate ${CONDA_ENV} && \
            cd models && \
            darts run_test_suite2.py LOG && \
            echo 'run_test_suite2 returned' $? && \
            cd .. && \
            # test discretizer
            cd discretizer/tests/compare_discretizers && \
            python main.py && \
            cd ../../.. && \
            echo 'test finished'
            "
    after_script:
        - |
            apptainer exec --nv "$APPTAINER_IMAGE" bash -lc "
                # exit on any error, print commands as you go
                set -euxo pipefail && \
                # enable Conda in this shell
                source /opt/conda/etc/profile.d/conda.sh && \
                # remove conda env
                conda env remove -n ${CONDA_ENV} -y || true
            "
    needs:
        - job: build-linux-tahiti-image-gpu
        - job: apptainer-image-builder
          artifacts: true
