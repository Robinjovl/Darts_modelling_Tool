.test-windows:
    stage: test
    # Will be executed on runner with windows tag - that assumed to run on windows host
    tags:
        - windows-shell
    variables:
        CONDA_ENV: "darts-win-${CI_JOB_ID}"
        CONDA_BIN_PATH: 'D:\miniconda3\condabin'
    before_script:
        # create and activate a conda env
        - if (-not ($env:PATH.Split(';') -contains $env:CONDA_BIN_PATH)) { $env:PATH = "$env:CONDA_BIN_PATH;$env:PATH" }`
        - $condaRoot = Split-Path $env:CONDA_BIN_PATH -Parent
        - $condaHookPath = Join-Path $condaRoot 'shell\condabin\conda-hook.ps1'
        - if (Test-Path $condaHookPath) { (& $condaHookPath) | Out-Null }
        # Initialize conda environment
        - conda create --name $env:CONDA_ENV python=$env:PY_VER --yes -q
        - conda activate $env:CONDA_ENV
        # enable unbuffered output so that everything goes to log file in a correct order
        - $env:PYTHONUNBUFFERED = 1
        - $env:PYTHONLEGACYWINDOWSSTDIO = 1
        - $PY_TAG = "cp$($env:PY_VER.Replace('.', ''))"
        - $WHEEL = Get-ChildItem -Path .\dist\ -Filter "*$PY_TAG*win*.whl" | Select-Object -First 1
        - if (-not $WHEEL) { throw "Wheel for python $env:PY_VER not found in .\\dist" }
        - $WHEEL_NAME = $WHEEL.Name
        # upgrade pip package first
        - python -m pip install --upgrade pip
        # remove flash installed by its pipelines, and get one from pip
        - pip uninstall open-darts-flash  --yes
        # force reinstall of darts wheel only (need to force because darts wheel version is not incremented)
        - pip install --force-reinstall --no-deps .\dist\$WHEEL_NAME
        # force-reinstall of dependencies takes too much time, lets only upgrade (eagerly!) them
        - pip install --upgrade --upgrade-strategy eager ".\dist\$WHEEL_NAME[test]"
    script:
        # run simulation fot test models set
        - cd models
        # passing additional argument to trigger verbose check performance
        - darts run_test_suite2.py LOG
        # Run the interpolator tests from a scratch CWD outside the checkout so Python
        # imports the installed wheel. From the repo root the in-source darts/ package
        # (which has no compiled extensions on Windows) shadows the site-packages wheel,
        # so `import darts.engines/interpolators` fails during collection. The tests
        # write nothing to CWD, so a shared scratch dir is safe. Mirrors test-linux.yml.
        - cd $env:TEMP
        - python -m pytest "$env:CI_PROJECT_DIR\tests\interpolators" -v
        - cd $env:CI_PROJECT_DIR
        # test discretizer
        - cd discretizer\tests\compare_discretizers
        - python main.py
        - cd ..\..\..
    after_script:
        # delete the conda env
        - if (-not ($env:PATH.Split(';') -contains $env:CONDA_BIN_PATH)) { $env:PATH = "$env:CONDA_BIN_PATH;$env:PATH" }`
        - $condaRoot = Split-Path $env:CONDA_BIN_PATH -Parent
        - $condaHookPath = Join-Path $condaRoot 'shell\condabin\conda-hook.ps1'
        - if (Test-Path $condaHookPath) { (& $condaHookPath) | Out-Null }
        - conda deactivate
        - conda env remove --name $env:CONDA_ENV --yes
        # archive the artifacts (.pkl files) if the option is enabled
        - cd models
        - .\archive_pkl.bat $env:ODLS $env:TEST_GPU
        - cd ..
    artifacts:
      paths:
        - '.\models\_logs\*.log'
        - '.\models\chemistry\_logs\chemistry\*.log'
        - '.\models\fracture_network\meshes*\*.log'
        - '.\models\displaced_fault_reactivation\meshes\*.log'
        - '.\models\pkl_win.zip'
      when: always
      expire_in: 1 week

# Windows test jobs. The unsuffixed `test-windows` is the in-tree open-source
# solvers (formerly "test-windows-ODLS"); `test-windows-BOS` is the proprietary
# BOS-solvers twin. See MR280_MASTER_PLAN.md §F.
test-windows:
    extends: .test-windows
    rules: &python_version_rules
        - if: '$PY_VER == $DEFAULT_PY_VER && ($CI_COMMIT_REF_PROTECTED == "true" || $CI_PIPELINE_SOURCE == "merge_request_event" || $TEST_CUSTOM_BRANCH == "1")'
        - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/
        - if: $TEST_ALL_PYTHONS == "1"
    variables:
        ODLS: ''
    needs:
        - job: build-windows
          parallel:
              matrix:
                  - PY_VER: ['$[[ matrix.PY_VER ]]']
    parallel:
        matrix:
            - PY_VER: '3.10'
            - PY_VER: '3.11'
            - PY_VER: '3.12'
            - PY_VER: '3.13'

# Proprietary BOS-solvers test twin (consumes the build-windows-BOS wheels).
test-windows-BOS:
    extends: .test-windows
    rules: *python_version_rules
    variables:
        ODLS: '-a'
    needs:
        - job: build-windows-BOS
          parallel:
              matrix:
                  - PY_VER: ['$[[ matrix.PY_VER ]]']
    parallel:
        matrix:
            - PY_VER: '3.10'
            - PY_VER: '3.11'
            - PY_VER: '3.12'
            - PY_VER: '3.13'
