# Gate that unlocks final validation in a merge-request pipeline.
#
# Why it exists: GitLab evaluates rules once, when the pipeline is created, and
# never reclassifies an existing pipeline when the MR stops being a draft.
# Marking an MR ready therefore does not add jobs to the pipeline that is
# already there. To make "pipeline is green" mean "valgrind ran for this commit",
# the final jobs must EXIST in every MR pipeline and be held behind this gate.
#
# Behaviour in an MR pipeline:
#   * draft: blocking manual job -> the pipeline stays "blocked", never "success",
#     so the "Pipelines must succeed" merge check keeps the MR unmergeable.
#     Marking the MR ready and pressing play here runs the real final jobs in
#     this same pipeline; no new pipeline is required.
#   * ready (MR_NON_DRAFT == "1"): starts automatically after the base stages.
#   * explicit overrides (RUN_FINAL_VALIDATION / TEST_CUSTOM_BRANCH /
#     TEST_ALL_PYTHONS): start automatically even while the MR is a draft.
#
# The gate only unlocks work: it has no needs, so it waits for the earlier
# stages, and the pipeline still goes green only if the jobs behind it pass.
# Outside merge requests the gate does not exist and the valgrind jobs keep
# their own eligibility rules (protected branches, main, release tags).
mr-ready-gate:
    stage: validation_gate
    tags:
        - linux
    image: "python:$DEFAULT_PY_VER"
    dependencies: []
    interruptible: true
    allow_failure: false
    rules:
        - if: $CI_PIPELINE_SOURCE != "merge_request_event"
          when: never
        # Deliberate overrides: run final validation even while the MR is a draft.
        - if: '$RUN_FINAL_VALIDATION == "1" || $TEST_CUSTOM_BRANCH == "1" || $TEST_ALL_PYTHONS == "1"'
          when: on_success
        # Draft: blocking manual gate.
        - if: $MR_NON_DRAFT != "1"
          when: manual
          allow_failure: false
        # Ready MR pipeline: start automatically.
        - when: on_success
    script:
        - |
          if [ "${MR_NON_DRAFT:-0}" = "1" ]; then
            echo "Ready MR: starting final validation for $CI_COMMIT_SHA"
          else
            echo "Final validation started manually for $CI_COMMIT_SHA"
            echo "NOTE: this pipeline was created while the MR was a draft, so the"
            echo "model suite already ran with the base case selection."
          fi
