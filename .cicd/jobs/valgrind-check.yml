.linux-profiler-base:
    # Same stage as build-linux-valgrind: same-stage `needs` is allowed, and the
    # gate in validation_gate already sequences both in an MR pipeline.
    stage: final_validation
    interruptible: true
    tags:
    - linux
    image: "python:$PY_VER"
    timeout: 2h
    variables:
        PY_VER: "$DEFAULT_PY_VER"
    rules:
        # Skip on .pkl reference-upload runs: the valgrind check is irrelevant there
        # (and build-linux-valgrind, which it needs, is also skipped).
        - if: $UPLOAD_PKL == "1"
          when: never
        # Eligibility must mirror build-linux-valgrind.yml (this job `needs` it).
        # In an MR pipeline the job is always created; it starts after the gate
        # because the valgrind build it depends on does.
        - if: $TEST_CUSTOM_BRANCH == "1"
        - if: $TEST_ALL_PYTHONS == "1"
        - if: $CI_COMMIT_REF_PROTECTED == "true"
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/
    needs:
        - build-linux-valgrind
    before_script:
        - export PY_SUF="cp${PY_VER/./}-cp${PY_VER/./}"
        - export PATH="/opt/python/$PY_SUF/bin:$PATH"
        # for gmsh
        - apt-get update -qq && apt-get install -y -qq libglu1-mesa-dev
        - apt-get update -qq && apt-get install -y -qq libxcursor1
        - apt-get update -qq && apt-get install -y -qq libxinerama1
        - export PYTHONUNBUFFERED=1
        - python -m pip install --upgrade pip
        # remove flash installed by its pipelines, and get one from pip
        - pip uninstall open-darts-flash
        - export WHEEL_PATH="$(ls ./dist/*.whl | head -n 1)"
        - pip install --upgrade --upgrade-strategy eager "${WHEEL_PATH}[test]"

valgrind-check:
    extends: .linux-profiler-base
    script:
        - apt-get update -qq && apt-get install -y -qq valgrind
        - echo ">>> Running Valgrind check script <<<"
        - python helper_scripts/valgrind_check.py
    artifacts:
      paths:
        - models/_valgrind_logs/*.log
        - models/_valgrind_logs/chemistry/*.log
        - models/_valgrind_logs/*.txt
        - models/_valgrind_logs/chemistry/*.txt
      when: always
      expire_in: 1 week
