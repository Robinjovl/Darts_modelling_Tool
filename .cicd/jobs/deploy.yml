deploy-pypi:
    # Publish the release
    # Runs only for the main branch and if tag has a pattern: v#.#.#, for example "v1.2.3"
    rules:
        - if: $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/
    extends: .deploy-pypi
    variables:
        REPO: 'pypi'
        REPOUSER: $PYPIUSER
        REPOPWD: $PYPIPWD

deploy-testpypi:
    # Test publishing the release
    # Runs only manually, if variable UPLOAD_TEST_PYPI set to 1
    only:
        variables:
            - $UPLOAD_TEST_PYPI == "1"
    extends: .deploy-pypi
    variables:
        REPO: 'testpypi'
        REPOUSER: $TESTPYPIUSER
        REPOPWD: $TESTPYPIPWD

# pick all whl ODLS-artifacts (windows/linux, different python versions) and upload to test pipy
# TODO auto-increment package version (in pyproject.toml and .gitlab-ci.yml) and add git tag; now it is done manually
.deploy-pypi:
    stage: deploy
    # just for twine
    image: python:3.10
    # Will be executed on runner with windows tag - that assumed to run on windows host
    tags:
        - linux
    before_script:
        # upgrade pip package first
        - python -m pip install --upgrade pip
        - pip install twine
    script:
        # upload to test-pypi or pypi depending on $PYPI var
        - ./helper_scripts/rename_whls.sh # rename linux whls to make uploadable to test-pypi
        - ls ./dist/*
        - twine upload -u $REPOUSER -p $REPOPWD --repository $REPO --verbose dist/*
    dependencies:
        # get the wheels from the build stage
        - build-linux-3.10-ODLS
        - build-linux-3.11-ODLS
        - build-linux-3.12-ODLS
        #- build-linux-3.13-ODLS
        - build-windows-3.10-ODLS
        - build-windows-3.11-ODLS
        - build-windows-3.12-ODLS
        - build-windows-3.13-ODLS

deploy-zenodo:
    stage: deploy
    rules:
        - if: $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/
    tags:
        - linux
    image: python:3.10
    script:
        # cloning gitlab2zenodo in a temporary folder
        - mkdir tmp_gitlab2zenodo
        - cd tmp_gitlab2zenodo
        - git clone https://gitlab.com/sbeniamine/gitlab2zenodo.git
        - cd gitlab2zenodo
        # and installing gitlab2zenodo
        - pip install .
        - cd ../..
        # making a .zip containing the source files
        - git archive --format zip --output ${CI_COMMIT_TAG#v}.zip ${CI_COMMIT_TAG}
        # command that publishes to zenodo
        - g2z-send -p -m .zenodo.json ${CI_COMMIT_TAG#v}.zip

pages:
    stage: deploy
    rules:
        - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/
        - if: $DOCS_PAGES == "1"
    tags:
        - linux
    image: python:3.10
    script:
        # re-install open-darts with the dependencies for building the documentation
        - pip install .[docs]
        # use the wheel generated in build to install open-darts
        - pip install --force-reinstall --no-deps ./dist/*cp310-linux_x86_64.whl
        - cd docs
        # command to build the documentation to a folder called public
        - sphinx-build -b html . public
        # move the folder public to the root of the project to be able to save it as artifact
        - mv public ../
    artifacts:
        paths:
        - public
    dependencies:
        - build-linux-3.10-ODLS

deploy-apptainer-image:
    stage: deploy
    tags:
        - linux_tahiti_gpu
    timeout: 4h
    variables:
        IMAGE_PREFIX: "open-darts"
    rules:
        - if: $RUN_APPTAINER_DEPLOY == "1"
        - if: $CI_PIPELINE_SOURCE == "schedule"
        - if: $CI_PIPELINE_SOURCE == "web"
          when: manual
        - when: never
    script:
        # Derive BUILD_KEY from the latest symlinked image name
        - IMG_DIR="/data/open-darts-apptainer-images"
        - LINK="$IMG_DIR/${IMAGE_PREFIX}-latest.sif"
        - TARGET="$(readlink -f "$LINK" || echo "$LINK")"
        - BASENAME="$(basename "$TARGET")"
        - BUILD_KEY="$(echo "$BASENAME" | sed -n "s/^${IMAGE_PREFIX}-\([a-f0-9]\{64\}\)\.sif$/\1/p")"
        # Fallback to the most recent matching file if symlink parse failed
        - 'if [ -z "$BUILD_KEY" ]; then TARGET="$(ls -1t "$IMG_DIR/${IMAGE_PREFIX}-"*.sif 2>/dev/null | head -n1 || true)"; BASENAME="$(basename "$TARGET" 2>/dev/null || true)"; BUILD_KEY="$(echo "$BASENAME" | sed -n "s/^${IMAGE_PREFIX}-\([a-f0-9]\{64\}\)\.sif$/\1/p")"; fi'
        - 'test -n "$BUILD_KEY" || { echo "Unable to determine BUILD_KEY from $LINK or $IMG_DIR" >&2; exit 2; }'
        - echo "BUILD_KEY=$BUILD_KEY"
        # target repo and existing tag check (skip if tag already present)
        - REPO="$CI_REGISTRY_IMAGE"
        - echo "REPO=$REPO"
        - echo "Skipping remote manifest pre-check; proceeding to push"
        # Locate built image (from shared /data path)
        - IMG="$IMG_DIR/${IMAGE_PREFIX}-${BUILD_KEY}.sif"
        - 'if [ ! -r "$IMG" ]; then IMG="$LINK"; fi'
        - 'test -r "$IMG" || { echo "Apptainer image not found: $IMG" >&2; exit 2; }'
        # Authenticate and push via ORAS (GitLab Container Registry)
        - export APPTAINER_DOCKER_USERNAME="$CI_REGISTRY_USER"
        - export APPTAINER_DOCKER_PASSWORD="$CI_REGISTRY_PASSWORD"
        - echo "Logging into registry $CI_REGISTRY with Apptainer"
        - apptainer registry login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "oras://$CI_REGISTRY" || echo "Apptainer registry login warning; continuing"
        # Try push; if tag exists, do not fail the job
        - |
          if apptainer push "$IMG" "oras://$REPO/apptainer:latest"; then
            echo "Pushed $REPO/apptainer:latest"
          else
            echo "Push failed"; exit 1;
          fi
