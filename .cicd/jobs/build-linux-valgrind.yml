include:
  - local: '.cicd/jobs/build-linux-base.yml'

build-linux-valgrind:
    # final_validation: shown last in the pipeline graph. The job keeps the
    # inherited .build-linux needs, so once allowed it starts as soon as the
    # image is available.
    stage: final_validation
    interruptible: true
    tags:
        - linux
    rules:
        # Skip on .pkl reference-upload runs: valgrind instrumentation is irrelevant there.
        - if: $UPLOAD_PKL == "1"
          when: never
        # Deliberate override: run valgrind even while the MR is a draft.
        # TEST_CUSTOM_BRANCH / TEST_ALL_PYTHONS intentionally do not enable valgrind.
        - if: $RUN_FINAL_VALIDATION == "1"
        # GitLab evaluates rules only when a pipeline is created, and marking an
        # MR ready does not start a new one. So the job exists in every MR
        # pipeline: in a draft one it is a blocking manual job, which keeps the
        # pipeline "blocked" (never "success") until it is played.
        - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $MR_NON_DRAFT != "1"
          when: manual
          allow_failure: false
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_REF_PROTECTED == "true"
        - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/
    extends: .build-linux
    variables:
        # Open-source in-tree solvers (the proprietary `-a` variant was
        # dropped with the ODLS/non-ODLS job consolidation) -- valgrind now
        # instruments the solver stack that actually ships.
        ODLS: ''
        PY_VER: "$DEFAULT_PY_VER"
    script:
        - echo ">>> Starting debug build (valgrind instrumentation) <<<"
        - ./helper_scripts/build_darts_cmake.sh -c -w -m -j 8 -v $ODLS -p
    artifacts:
      paths:
        - './dist/*.whl'
        - '*.log'
      expire_in: 1 day
      when: always
