include:
  - local: '.cicd/jobs/build-linux-base.yml'

build-linux-valgrind:
    # final_validation (not build): in an MR pipeline this job waits for
    # mr-ready-gate, which lives in the preceding validation_gate stage.
    stage: final_validation
    interruptible: true
    tags:
        - linux
    rules:
        # Skip on .pkl reference-upload runs: valgrind instrumentation is irrelevant there.
        - if: $UPLOAD_PKL == "1"
          when: never
        # Every MR pipeline contains this job -- draft ones too -- but it starts
        # only once mr-ready-gate has been played (draft) or has run (ready).
        # A matched rules:needs replaces the inherited .build-linux needs
        # completely, so the image producer is repeated here.
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
          needs:
            - job: mr-ready-gate
              artifacts: false
            - job: docker-image-builder
              optional: true
              artifacts: false
        # Non-MR pipelines keep the inherited .build-linux needs.
        - if: $TEST_CUSTOM_BRANCH == "1"
        - if: $TEST_ALL_PYTHONS == "1"
        - if: $CI_COMMIT_REF_PROTECTED == "true"
        - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/
    extends: .build-linux
    variables:
        # Open-source in-tree solvers (the proprietary `-a` variant was
        # dropped with the ODLS/non-ODLS job consolidation) -- valgrind now
        # instruments the solver stack that actually ships.
        ODLS: ''
        PY_VER: "$DEFAULT_PY_VER"
    script:
        - echo ">>> Starting debug build (valgrind instrumentation) <<<"
        - ./helper_scripts/build_darts_cmake.sh -c -w -m -j 8 -v $ODLS -p
    artifacts:
      paths:
        - './dist/*.whl'
        - '*.log'
      expire_in: 1 day
      when: always
