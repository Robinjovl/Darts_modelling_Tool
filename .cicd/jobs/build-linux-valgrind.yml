include:
  - local: '.cicd/jobs/build-linux-base.yml'

build-linux-valgrind:
    stage: build
    tags:
        - linux
    rules:
        - if: $CI_COMMIT_REF_PROTECTED == "true"
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/
        - if: $TEST_CUSTOM_BRANCH == "1"
        - if: $TEST_ALL_PYTHONS == "1"
    extends: .build-linux
    variables:
        ODLS: '-a'
    parallel: &valgrind_python_matrix
        matrix:
            - PY_VER: !reference [.default-python-version, variables, DEFAULT_PY_VER]
    script:
        - echo ">>> Starting debug build (valgrind instrumentation) <<<"
        - ./helper_scripts/build_darts_cmake.sh -c -w -m -j 8 -v $ODLS -p
    artifacts:
      paths:
        - './dist/*.whl'
        - '*.log'
      expire_in: 1 day
      when: always
