pre-commit:
    stage: pre_commit
    tags:
        - linux_tahiti_gpu
    variables:
        PRE_COMMIT_HOME: ".cache/pre-commit"
        CONDA_ENV: "precommit-${CI_JOB_ID}"
    before_script:
        - echo 'Setting up pre-commit on tahiti (conda env + cache)...'
        - spack env activate open_darts_gcc134
        - CONDA_BASE="/data/gitlab-runner/miniconda3"
        - . "${CONDA_BASE}/etc/profile.d/conda.sh"
        - conda create -n "${CONDA_ENV}" python=3.10 -q -y
        - conda activate "${CONDA_ENV}"
        - python -m pip install --upgrade pip
        - pip install pre-commit
        - pre-commit clean || true
    script:
        - echo 'Running pre-commit checks (Python, YAML, TOML)...'
        - pre-commit --version
        - pre-commit validate-config || true
        - |
          # locating the files to be checked
          set -eu
          FILES="$(
            {
              git ls-files -- 'darts' 'tests' 'helper_scripts' '.cicd' '.gitlab-ci.yml' '.pre-commit-config.yaml' 'pyproject.toml' 2>/dev/null || true
            } | grep -E '\.(py|ya?ml|toml)$' || true
          )"
          echo $FILES
          # if FILES is not empty, run pre-commit checks
          if [ -n "$FILES" ]; then
            pre-commit run -v --files $FILES --show-diff-on-failure --color always 2>&1 | tee linting_output.log
          else
            echo "No files matched for pre-commit checks"; exit 0
          fi
    after_script:
        - CONDA_BASE="/data/gitlab-runner/miniconda3"
        - . "${CONDA_BASE}/etc/profile.d/conda.sh"
        - conda deactivate || true
        - conda env remove -n "${CONDA_ENV}" -y || true
    artifacts:
        paths:
            - linting_output.log
            - gitlab_ci_verify_report.json
        expire_in: 1 week
        when: always
    rules:
        - if: $CI_COMMIT_REF_PROTECTED == "true"
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/
        - if: $TEST_CUSTOM_BRANCH == "1"
        - if: $TEST_ALL_PYTHONS == "1"
    allow_failure: false
