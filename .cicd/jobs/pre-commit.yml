pre-commit:
    stage: pre_commit
    tags:
        - linux_tahiti_gpu
    variables:
        PRE_COMMIT_HOME: "/data/gitlab-runner/.cache/pre-commit"
        CONDA_ENV: "precommit-${CI_JOB_ID}"
        # Job-private conda package cache to avoid races on the shared
        # /data/gitlab-runner/miniconda3/pkgs/ cache (concurrent jobs on the
        # same runner have left half-extracted packages there, breaking
        # later `conda create` with "Cannot link a source that does not exist").
        CONDA_PKGS_DIRS: "${CI_PROJECT_DIR}/.conda-pkgs"
    before_script:
        - echo 'Setting up pre-commit on tahiti (conda env + cache)...'
        - spack env activate open_darts_gcc134
        - CONDA_BASE="/data/gitlab-runner/miniconda3"
        - . "${CONDA_BASE}/etc/profile.d/conda.sh"
        - conda create -n "${CONDA_ENV}" python=$DEFAULT_PY_VER -q -y
        - conda activate "${CONDA_ENV}"
        - python -m pip install --upgrade pip
        - pip install pre-commit
        - pre-commit clean || true
    script:
        # Runs the ruff/YAML/TOML hooks over the files listed below, plus the
        # whole-tree repository-policy hooks declared with `always_run: true` in
        # .pre-commit-config.yaml: `sync-agent-skills-check` (skill mirror) and
        # `placement-policy` (helper_scripts/check_placement_policy.py -- no
        # module in darts/ without an in-repo consumer, no upward import from
        # models/). Those two scan the checkout themselves and are independent
        # of the file list.
        - echo 'Running pre-commit checks (Python, YAML, TOML, repository policy)...'
        - pre-commit --version
        - pre-commit validate-config || true
        - |
          # locating the files to be checked
          set -eu
          FILES="$(
            {
              git ls-files -- 'darts' 'tests' 'helper_scripts' '.cicd' '.agents' '.gitlab-ci.yml' '.pre-commit-config.yaml' 'pyproject.toml' 2>/dev/null || true
            } | grep -E '\.(py|ya?ml|toml)$' || true
          )"
          echo $FILES
          # if FILES is not empty, run pre-commit checks
          if [ -n "$FILES" ]; then
            pre-commit run -v --files $FILES --show-diff-on-failure --color always 2>&1 | tee linting_output.log
          else
            echo "No files matched for pre-commit checks"; exit 0
          fi
    after_script:
        - CONDA_BASE="/data/gitlab-runner/miniconda3"
        - . "${CONDA_BASE}/etc/profile.d/conda.sh"
        - conda deactivate || true
        - conda env remove -n "${CONDA_ENV}" -y || true
    artifacts:
        paths:
            - linting_output.log
            - gitlab_ci_verify_report.json
        expire_in: 1 week
        when: always
    rules:
        - if: $CI_COMMIT_REF_PROTECTED == "true"
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/
        - if: $TEST_CUSTOM_BRANCH == "1"
        - if: $TEST_ALL_PYTHONS == "1"
    allow_failure: false
