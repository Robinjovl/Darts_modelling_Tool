.build-linux-gpu:
    stage: build
    rules:
        - if: $CI_COMMIT_REF_PROTECTED == "true"
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/
        - if: $TEST_CUSTOM_BRANCH == "1"
        - if: $TEST_GPU_LINUX == "1"
    variables:
        GIT_SUBMODULE_STRATEGY: recursive
        PY_VER: '3.10'       # for python image selection in .build-linux
        ODLS: '-a'
        TEST_GPU: '1' 
    script:
        - echo "build *.so on linux GPU started with ODLS=$ODLS"
        - ./helper_scripts/build_install_darts_gpu.sh -c -p
    artifacts:
      paths:
        - './dist/*.whl'
        - '*.log'
      expire_in: 1 day
      when: always

build-linux-oahu-3.10-gpu:
    tags:
        - linux_gpu
    before_script:
        - module load cuda/23.5
        - source /oahu/data/open-darts-gitlab-runner-data/anaconda3/bin/activate
        - conda create -n darts_gitlab_gpu_build python=${PY_VER} --yes
        - conda activate darts_gitlab_gpu_build
    extends: .build-linux-gpu

build-linux-tahiti-3.10-gpu:
    tags:
        - linux_tahiti_gpu
    before_script:
        - spack env activate open_darts_gcc134
        - eval "$(conda shell.bash hook)"
        - conda create -n darts_gitlab_gpu_build python=${PY_VER} --yes
        - conda activate darts_gitlab_gpu_build
        - export GSELINSOLVERSPATH=/data/gitlab-runner/darts-linear-solvers/build
        - export GPU_DEVICE=0
    rules:
        - if: $CI_COMMIT_REF_PROTECTED == "true"
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/
        - if: $TEST_CUSTOM_BRANCH == "1"
        - if: $TEST_GPU_LINUX == "1"
    extends: .build-linux-gpu 

build-linux-tahiti-image-3.10-gpu:
    tags:
        - linux_tahiti_gpu
    image: 
        name: "apptainer"
        entrypoint: [""]
    needs:
        - apptainer-image-builder
    variables:
        APPTAINER_IMAGE: "/data/gitlab-runner/open-darts-latest.sif"
        CONDA_ENV: "tahiti-gpu"
        PY_VER: "3.10"
    before_script:
        - echo "🔧 Creating Conda env '${CONDA_ENV}' inside the Apptainer image…"
        - |
          apptainer exec --nv "$APPTAINER_IMAGE" bash -lc "
            eval \"\$(conda shell.bash hook)\" \
            && conda create -n ${CONDA_ENV} python=${PY_VER} --yes \
            && conda clean -afy
          "
    script:
        - echo "🚀 Building DARTS GPU libs inside '${CONDA_ENV}'…"
        - |
          apptainer exec --nv "$APPTAINER_IMAGE" bash -lc "
            set -euo pipefail \
            eval \"\$(conda shell.bash hook)\" \
            conda activate ${CONDA_ENV} \
            ./helper_scripts/build_install_darts_gpu.sh -c -p
          "
    extends: .build-linux-gpu