.build-linux-gpu:
    stage: build
    rules:
        - if: $CI_COMMIT_REF_PROTECTED == "true"
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/
        - if: $TEST_CUSTOM_BRANCH == "1"
        - if: $TEST_GPU_LINUX == "1"
    variables:
        GIT_SUBMODULE_STRATEGY: recursive
        PY_VER: '3.10'       # for python image selection in .build-linux
        ODLS: '-a'
        TEST_GPU: '1'
    script:
        - echo "build *.so on linux GPU started with ODLS=$ODLS"
        - ./helper_scripts/build_install_darts_gpu.sh -c -p
    artifacts:
      paths:
        - './dist/*.whl'
        - '*.log'
      expire_in: 1 day
      when: always
    needs: []

build-linux-oahu-3.10-gpu:
    tags:
        - linux_gpu
    before_script:
        - module load cuda/23.5
        - source /oahu/data/open-darts-gitlab-runner-data/anaconda3/bin/activate
        - conda create -n darts_gpu python=${PY_VER} --yes
        - conda activate darts_gpu
    extends: .build-linux-gpu

build-linux-tahiti-3.10-gpu:
    tags:
        - linux_tahiti_gpu
    before_script:
        - spack env activate open_darts_gcc134
        - CONDA_BASE="/data/gitlab-runner/miniconda3"
        - . "${CONDA_BASE}/etc/profile.d/conda.sh"
        - conda create -n darts_gpu python=${PY_VER} -q -y
        - conda activate darts_gpu
        - export GSELINSOLVERSPATH=/data/$(id -un)/darts-linear-solvers/build
    rules:
        - if: $CI_COMMIT_REF_PROTECTED == "true"
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/
        - if: $TEST_CUSTOM_BRANCH == "1"
        - if: $TEST_GPU_LINUX == "1"
    extends: .build-linux-gpu

build-linux-tahiti-image-3.10-gpu:
    tags:
        - linux_tahiti_gpu
    image:
        name: "apptainer"
        entrypoint: [""]
    needs:
        - job: apptainer-image-builder
    variables:
        APPTAINER_IMAGE: "/data/open-darts-apptainer-images/open-darts-latest.sif"
        CONDA_ENV: "tahiti-gpu"
        PY_VER: "3.10"
    before_script:
        - echo "🔧 Creating Conda env '${CONDA_ENV}' inside the Apptainer image…"
        - |
          apptainer exec --nv "$APPTAINER_IMAGE" bash -lc "
            eval \"\$(conda shell.bash hook)\" \
            && conda create -n ${CONDA_ENV} python=${PY_VER} -q -y \
            && conda clean -afy
          "
    script:
        - echo "🚀 Building DARTS GPU libs inside '${CONDA_ENV}'…"
        - |
            apptainer exec --nv "$APPTAINER_IMAGE" bash -lc "
                # exit on any error, print commands as you go
                set -euxo pipefail && \
                # enable Conda in this shell
                eval \"\$(conda shell.bash hook)\" && \
                # activate your env
                conda activate ${CONDA_ENV} && \
                # _this_ is your real build
                ./helper_scripts/build_install_darts_gpu.sh -c -p
            "
    extends: .build-linux-gpu
