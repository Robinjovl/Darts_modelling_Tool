.build-linux-gpu:
    stage: build
    rules:
        - if: $CI_COMMIT_REF_PROTECTED == "true"
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/
        - if: $TEST_CUSTOM_BRANCH == "1"
    variables:
        GIT_SUBMODULE_STRATEGY: recursive
        ODLS: '-a'
        TEST_GPU: '1'
        CONDA_ENV: "darts_gpu_${CI_JOB_ID}"
    script:
        - echo "build *.so on linux GPU started with ODLS=$ODLS"
        - ./helper_scripts/build_install_darts_gpu.sh -c -p -j 20
    artifacts:
      paths:
        - './dist/*.whl'
        - '*.log'
      expire_in: 1 day
      when: always
    needs: []

build-linux-oahu-gpu:
    tags:
        - linux_gpu
    variables:
        CONDAPATH: /oahu/data/gitlabrunner/anaconda3
        GSELINSOLVERSPATH: /oahu/data/gitlabrunner/darts-gitlab-runner-data/darts-linear-solvers-gpu-hypre
    parallel: &gpu_python_matrix
        matrix:
            - PY_VER: "$DEFAULT_PY_VER"
    before_script:
        - module load cuda/23.5
        - source ${CONDAPATH}/bin/activate
        - conda create -n ${CONDA_ENV} python=${PY_VER} --yes
        - conda activate ${CONDA_ENV}
    after_script:
        - source ${CONDAPATH}/bin/activate
        - conda env remove -n ${CONDA_ENV} -y || true
    extends: .build-linux-gpu


build-linux-tahiti-gpu:
    tags:
        - linux_tahiti_gpu
    variables:
        CONDAPATH: /data/gitlab-runner/miniconda3
    parallel: *gpu_python_matrix
    before_script:
        - spack env activate open_darts_gcc134
        - . "${CONDAPATH}/etc/profile.d/conda.sh"
        - conda env remove -n ${CONDA_ENV} -y || true
        - conda create -n ${CONDA_ENV} python=${PY_VER} -q -y
        - conda activate ${CONDA_ENV}
        - export GSELINSOLVERSPATH=/data/$(id -un)/darts-linear-solvers/build
    after_script:
        - spack env activate open_darts_gcc134
        - . "${CONDAPATH}/etc/profile.d/conda.sh"
        - conda env remove -n ${CONDA_ENV} -y || true
    rules:
        - if: $MCP_TRIGGER_TAHITI_GPU == "1"
        - when: never
    extends: .build-linux-gpu

build-linux-tahiti-image-gpu:
    tags:
        - linux_tahiti_gpu
    image:
        name: "apptainer"
        entrypoint: [""]
    needs:
        - job: apptainer-image-builder
    variables:
        APPTAINER_IMAGE: "/data/open-darts-apptainer-images/open-darts-latest.sif"
    parallel: *gpu_python_matrix
    before_script:
        - echo "🔧 Creating Conda env '${CONDA_ENV}' inside the Apptainer image…"
        - |
          apptainer exec --nv "$APPTAINER_IMAGE" bash -lc "
            source /opt/conda/etc/profile.d/conda.sh \
            && conda create -n ${CONDA_ENV} python=${PY_VER} -q -y \
            && conda clean -afy
          "
    script:
        - echo "🚀 Building DARTS GPU libs inside '${CONDA_ENV}'…"
        - |
            apptainer exec --nv "$APPTAINER_IMAGE" bash -lc "
                # exit on any error, print commands as you go
                set -euxo pipefail && \
                # enable Conda in this shell
                source /opt/conda/etc/profile.d/conda.sh && \
                # activate your env
                conda activate ${CONDA_ENV} && \
                # _this_ is your real build
                ./helper_scripts/build_install_darts_gpu.sh -c -p -j 16
            "
    after_script:
        - |
            apptainer exec --nv "$APPTAINER_IMAGE" bash -lc "
                # exit on any error, print commands as you go
                set -euxo pipefail && \
                # enable Conda in this shell
                source /opt/conda/etc/profile.d/conda.sh && \
                # remove conda env
                conda env remove -n ${CONDA_ENV} -y || true
            "
    extends: .build-linux-gpu
