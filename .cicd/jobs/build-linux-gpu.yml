.build-linux-gpu:
    stage: build
    rules:
        - if: $MCP_TRIGGER_TAHITI_GPU == "1"
          when: never
        - if: $CI_COMMIT_REF_PROTECTED == "true"
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/
        - if: $TEST_CUSTOM_BRANCH == "1"
    variables:
        GIT_SUBMODULE_STRATEGY: recursive
        ODLS: ''   # vestigial for the GPU build (GSELINSOLVERSPATH drives bos linkage); kept '' for pkl-suffix consistency
        TEST_GPU: '1'
        PY_VER: $DEFAULT_PY_VER
        CONDA_ENV: "darts_gpu_${CI_JOB_ID}"
        # cuDSS GPU direct solver: NOT built in CI by default. The oahu job
        # overrides this to '--cudss' and pip-installs the prebuilt cuDSS library.
        CUDSS_FLAG: '--no-cudss'
    script:
        - echo "build *.so on linux GPU started with ODLS=$ODLS"
        - ./helper_scripts/build_install_darts_gpu.sh -c -p $CUDSS_FLAG -j 20
        - |
          WARN_COUNT=$(grep -oP 'OPENDARTS_WARNING_COUNT=\K[0-9]+' make_darts.log 2>/dev/null | tail -1)
          WARN_COUNT=${WARN_COUNT:-0}
          if [ "$WARN_COUNT" -gt 0 ] && { [ "$CI_COMMIT_BRANCH" = "development" ] || [ "$CI_COMMIT_BRANCH" = "main" ]; }; then
            echo "FAILED: $WARN_COUNT open-DARTS compilation warning(s) on $CI_COMMIT_BRANCH branch"
            exit 1
          fi
    artifacts:
      paths:
        - './dist/*.whl'
        - '*.log'
      expire_in: 1 day
      when: always
    needs: []

build-linux-oahu-gpu:
    tags:
        - linux_gpu
    variables:
        CONDAPATH: /oahu/data/gitlabrunner/anaconda3
        GSELINSOLVERSPATH: /oahu/data/gitlabrunner/darts-gitlab-runner-data/darts-linear-solvers-gpu-hypre
        CUDSS_FLAG: '--cudss'   # oahu builds WITH the cuDSS GPU direct solver
    before_script:
        - module load cuda/13.3
        - source ${CONDAPATH}/bin/activate
        - conda create -n ${CONDA_ENV} python=${PY_VER} --yes
        - conda activate ${CONDA_ENV}
        # cuDSS is a prebuilt C++ library (cudss.h + libcudss.so). The
        # nvidia-cudss-cu13 wheel is just the delivery channel -- it unpacks the
        # C++ lib into the env's site-packages/nvidia/cu13/{include,lib}, which
        # thirdparty/thirdparty_cudss.cmake then discovers and links at build time.
        - pip install nvidia-cudss-cu13
    after_script:
        - source ${CONDAPATH}/bin/activate
        - conda env remove -n ${CONDA_ENV} -y || true
    extends: .build-linux-gpu


build-linux-tahiti-gpu:
    tags:
        - linux_tahiti_gpu
    variables:
        CONDAPATH: /data/gitlab-runner/miniconda3
    before_script:
        - spack env activate open_darts_gcc134
        - . "${CONDAPATH}/etc/profile.d/conda.sh"
        - conda env remove -n ${CONDA_ENV} -y || true
        - conda create -n ${CONDA_ENV} python=${PY_VER} -q -y
        - conda activate ${CONDA_ENV}
        - export GSELINSOLVERSPATH=/data/$(id -un)/darts-linear-solvers/build
    after_script:
        - spack env activate open_darts_gcc134
        - . "${CONDAPATH}/etc/profile.d/conda.sh"
        - conda env remove -n ${CONDA_ENV} -y || true
    rules:
        - if: $MCP_TRIGGER_TAHITI_GPU == "1"
        - when: never
    extends: .build-linux-gpu

build-linux-tahiti-image-gpu:
    tags:
        - linux_tahiti_gpu
    image:
        name: "apptainer"
        entrypoint: [""]
    needs:
        - job: apptainer-image-builder
          artifacts: true
    before_script:
        - |
          set -euo pipefail
          if [ -z "${APPTAINER_IMAGE:-}" ]; then
            echo "APPTAINER_IMAGE is not set (expected from apptainer-image-builder dotenv artifact)"
            exit 1
          fi
          if [ ! -f "$APPTAINER_IMAGE" ]; then
            echo "Apptainer image does not exist: $APPTAINER_IMAGE"
            ls -la /data/open-darts-apptainer-images || true
            exit 1
          fi
          echo "Using Apptainer image: $APPTAINER_IMAGE"
        - echo "🔧 Creating Conda env '${CONDA_ENV}' inside the Apptainer image…"
        - |
          apptainer exec --nv "$APPTAINER_IMAGE" bash -lc "
            source /opt/conda/etc/profile.d/conda.sh \
            && conda create -n ${CONDA_ENV} python=${PY_VER} -q -y \
            && conda clean -afy
          "
    script:
        - echo "🚀 Building DARTS GPU libs inside '${CONDA_ENV}'…"
        - |
            apptainer exec --nv "$APPTAINER_IMAGE" bash -lc "
                # exit on any error, print commands as you go
                set -euxo pipefail && \
                # enable Conda in this shell
                source /opt/conda/etc/profile.d/conda.sh && \
                # activate your env
                conda activate ${CONDA_ENV} && \
                # open-source build only
                unset GSELINSOLVERSPATH && \
                export OD_CMAKE_ARGS='-D ENABLE_BOS_SOLVERS=OFF' && \
                # _this_ is your real build (--no-cudss: cuDSS not built in CI)
                ./helper_scripts/build_install_darts_gpu.sh -c -p --no-cudss -j 16
            "
        - |
          # Guard: this job must ship an open-source-solver wheel. CMakeCache is
          # what the build actually configured with, so assert on it rather than
          # on the flags we passed.
          if ! grep -qx 'ENABLE_BOS_SOLVERS:BOOL=OFF' build/CMakeCache.txt; then
            echo "FAILED: apptainer GPU build did not disable the proprietary BOS solvers"
            grep -n 'ENABLE_BOS_SOLVERS\|BOS_SOLVERS_DIR' build/CMakeCache.txt || true
            exit 1
          fi
          if grep -q '^BOS_SOLVERS_DIR' build/CMakeCache.txt; then
            echo "FAILED: BOS_SOLVERS_DIR is set for the apptainer GPU build"
            grep -n '^BOS_SOLVERS_DIR' build/CMakeCache.txt
            exit 1
          fi
          echo "OK: built against the in-tree open-source solvers (no bos / darts-linear-solvers)"
        - |
          WARN_COUNT=$(grep -oP 'OPENDARTS_WARNING_COUNT=\K[0-9]+' make_darts.log 2>/dev/null | tail -1)
          WARN_COUNT=${WARN_COUNT:-0}
          if [ "$WARN_COUNT" -gt 0 ] && { [ "$CI_COMMIT_BRANCH" = "development" ] || [ "$CI_COMMIT_BRANCH" = "main" ]; }; then
            echo "FAILED: $WARN_COUNT open-DARTS compilation warning(s) on $CI_COMMIT_BRANCH branch"
            exit 1
          fi
    after_script:
        - |
            apptainer exec --nv "$APPTAINER_IMAGE" bash -lc "
                # exit on any error, print commands as you go
                set -euxo pipefail && \
                # enable Conda in this shell
                source /opt/conda/etc/profile.d/conda.sh && \
                # remove conda env
                conda env remove -n ${CONDA_ENV} -y || true
            "
    extends: .build-linux-gpu
