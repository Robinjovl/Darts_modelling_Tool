gitingest-digest:
    stage: pre_commit
    tags:
        - linux_tahiti_gpu
    needs: []
    variables:
        # Python to use for the temporary environment
        PY_VER: "3.10"
        # Optional manifest file (one path per line; lines starting with # are comments)
        GITINGEST_MANIFEST: "helper_scripts/gitingest-include.txt"
        # Output directory and file for the digest
        GITINGEST_OUT_DIR: "digest"
        GITINGEST_OUTPUT: "digest/gitingest-digest.json"
    before_script:
        - set -euo pipefail
        # Prepare Python env on Tahiti runner (same pattern as GPU tests)
        - spack env activate open_darts_gcc134 || true
        - CONDA_BASE="/data/gitlab-runner/miniconda3"
        - . "${CONDA_BASE}/etc/profile.d/conda.sh"
        - conda create -n gitingest python=${PY_VER} -q -y
        - conda activate gitingest
        - python -m pip install --upgrade pip
        # Try to install gitingest if available on PyPI; job will still succeed if not
        - pip install --upgrade gitingest || true
    script:
        - set -euo pipefail
        - mkdir -p "${GITINGEST_OUT_DIR}" "${GITINGEST_OUT_DIR}/src"
          # Read paths directly from manifest (no temp include list)
        - |
          if [ ! -f "${GITINGEST_MANIFEST}" ]; then
            echo "Manifest not found: ${GITINGEST_MANIFEST}" >&2
            exit 1
          fi
          if ! grep -vE '^(#|[[:space:]]*$)' "${GITINGEST_MANIFEST}" | grep -q .; then
            echo "No files specified in ${GITINGEST_MANIFEST}." >&2
            exit 1
          fi
          echo "Resolved include list:"
          grep -vE '^(#|[[:space:]]*$)' "${GITINGEST_MANIFEST}" | sort -u
          # Validate and copy files preserving directory structure
        - MISSING=0
        - |
          while IFS= read -r relpath; do
            [ -z "$relpath" ] && continue
            [ "${relpath#\#}" != "$relpath" ] && continue  # skip comments
            if [ -e "$relpath" ]; then
              mkdir -p "${GITINGEST_OUT_DIR}/src/$(dirname "$relpath")"
              # Prefer --parents when available
              cp --parents -a "$relpath" "${GITINGEST_OUT_DIR}/src" 2>/dev/null || cp -a "$relpath" "${GITINGEST_OUT_DIR}/src/$relpath"
            else
              echo "WARN: missing path: $relpath" >&2
              MISSING=$((MISSING+1))
            fi
          done < <(grep -vE '^(#|[[:space:]]*$)' "${GITINGEST_MANIFEST}" | sort -u)
        - |
          if [ "$MISSING" -gt 0 ]; then
            echo "There were $MISSING missing paths (continuing)." >&2
          fi
          # Run gitingest if available (manifest-only flow)
        - |
          if command -v gitingest >/dev/null 2>&1; then
            echo "Running gitingest CLI..."
            gitingest --root "${GITINGEST_OUT_DIR}/src" --output "${GITINGEST_OUTPUT}" > "${GITINGEST_OUT_DIR}/gitingest-output.txt" 2>"${GITINGEST_OUT_DIR}/gitingest-stderr.txt" || true
          else
            echo "gitingest CLI not found; skipping digest generation." >&2
          fi
        - |
          # Always package the selected sources as a tarball for convenience
          tar -C "${GITINGEST_OUT_DIR}/src" -czf "${GITINGEST_OUT_DIR}/src.tar.gz" .
        - echo "Digest preparation completed."
    rules:
        - if: $RUN_GITINGEST == "1"
        - when: manual
    artifacts:
        paths:
            - "${GITINGEST_OUTPUT}"
            - "${GITINGEST_OUT_DIR}/gitingest-output.txt"
            - "${GITINGEST_OUT_DIR}/gitingest-stderr.txt"
            - "${GITINGEST_OUT_DIR}/src.tar.gz"
        when: always
        expire_in: 1 week
