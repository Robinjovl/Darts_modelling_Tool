pre-commit:
    stage: pre_commit
    image: "python:3.10"
    tags:
        - linux
    cache:
      key: pre-commit
      paths:
        - .cache/pre-commit
    before_script:
        - echo 'Installing pre-commit tools...'
        - apt-get update && apt-get install -y --no-install-recommends git
        - python -m pip install --upgrade pip
        - pip install pre-commit
    script:
        - echo 'Running pre-commit checks (Python, YAML, TOML)...'
        - |
          # locating the files to be checked
          set -eu
          FILES="$(
            {
              git ls-files -- 'darts' 'tests' 'helper_scripts' '.cicd' '.gitlab-ci.yml' '.pre-commit-config.yaml' 'pyproject.toml' 2>/dev/null || true
            } | grep -E '\.(py|ya?ml|toml)$' || true
          )"
          echo $FILES
          # if FILES is not empty, run pre-commit checks
          if [ -n "$FILES" ]; then
            pre-commit run --files $FILES --show-diff-on-failure --color always 2>&1 | tee linting_output.log
          else
            echo "No files matched for pre-commit checks"; exit 0
          fi
    artifacts:
        paths:
            - linting_output.log
        expire_in: 1 week
        when: always
    rules:
        - if: $CI_COMMIT_REF_PROTECTED == "true"
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/
        - if: $TEST_CUSTOM_BRANCH == "1"
        - if: $TEST_ALL_PYTHONS == "1"
    allow_failure: true
